# Dependency update proposals. Weekly, grouped per ecosystem, with a low PR cap: every new or bumped
# dependency here still needs the decart comparison CLAUDE.md asks for ("No silent adoption"), and
# CI's supply-chain job (cargo deny) judges each Rust bump against deny.toml.
#
# There is no cargo workspace, so each product crate is listed on its own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: cargo
    directories:
      - /crates/dowiz-core
      - /crates/dowiz-hub
      - /crates/bebop-store
      - /crates/bebop-wasm
      - /workers/api
      - /tools/gen-vocab
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ['*']

  # wrangler, pinned in workers/package.json.
  - package-ecosystem: npm
    directory: /workers
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
