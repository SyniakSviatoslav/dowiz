name: CI

# WHAT A GREEN BADGE HERE MEANS: every crate the live product is made of passed its own suite, every
# gate in tools/gates/ exited 0 after its proof showed it can fire, the browser modules passed their
# node tests, the Worker compiled for wasm32 with the pinned toolchain, and the courier's offline
# queue worked in a real browser. docs/testing.md maps each job to what it proves.
#
# There is NO cargo workspace: each crate is entered with `cd`. `cargo -p` or `--manifest-path`
# from the root resolves the wrong target graph and can pass as exit 0 (CLAUDE.md, "Build model").
# The toolchain is pinned by rust-toolchain.toml (1.96.1); rustup applies it in every crate dir.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: '1.96.1'

jobs:
  # THE CRATES THE LIVE PRODUCT IS MADE OF. Until 2026-09-21 nothing ran the order log, the storage
  # format or a single Worker route; scripts/verify-hub.sh is the same list for a laptop.
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '${{ env.RUST_TOOLCHAIN }}' }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/bebop-store
            crates/dowiz-core
            crates/dowiz-hub
            crates/bebop-wasm
            workers/api
            tools/native-spa-server
            tools/gen-vocab
      - name: bebop-store (the image format)
        run: cd crates/bebop-store && cargo test
      - name: dowiz-core (the kernel)
        run: cd crates/dowiz-core && cargo test
      - name: dowiz-hub (one venue's images as pure logic)
        run: cd crates/dowiz-hub && cargo test
      # The room's amend and pay deciders built into the wasm32 module: the browser and the
      # server must produce the same bytes (D7 phase 1).
      - name: bebop-wasm with the room deciders
        run: cd crates/bebop-wasm && cargo test --features decide
      - name: workers/api (every route's pure half)
        run: cd workers/api && cargo test
      # The native twin of the owner/courier/storefront routes. Never tested before 2026-09-21,
      # so two of its tests had been failing on developer boxes with nothing reporting it.
      - name: native-spa-server
        run: cd tools/native-spa-server && cargo test
      # Links dowiz-core and cross-checks FSM_GOLDEN_SIGNATURE, so a kernel change that moves the
      # FSM fails here before it reaches a browser.
      - name: gen-vocab
        run: cd tools/gen-vocab && cargo test

  # EVERY GATE, ONE TABLE. run-all.sh discovers tools/gates/*.sh by glob, so a gate added to that
  # directory runs here without editing this file -- three gates once sat committed and ran
  # nowhere. Each *.prove.sh runs before its gate. --cargo adds vocab.sh (compiles gen-vocab) and
  # the bebop-wasm four-reader gate (bebop.bin is AArch64-only: NOT MEASURED here, and said so).
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '${{ env.RUST_TOOLCHAIN }}', targets: wasm32-unknown-unknown }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/gen-vocab
            crates/bebop-wasm
      # vocab.sh runs `cargo run --offline`; a cold runner has nothing to be offline with.
      - name: fetch gen-vocab's dependencies
        run: cd tools/gen-vocab && cargo fetch
      - name: every gate, with its proof
        run: sh tools/gates/run-all.sh --cargo

  browser-units:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: node --test over every browser module test
        run: node --test $(find workers/api/public -name '*.test.mjs' | sort)

  # THE LESSON VIDEO PIPELINE (Wave L, L9). No browser, no venue, no network: the recorder's rules,
  # the assembly plan, the ffprobe self-review (check.sh, driven end to end by assemble.test.mjs on
  # a synthetic recording -- hence ffmpeg), the publish/R2 logic against a fake `put`, and the
  # run's order/state. 100 % lines, branches and functions of the modules (2026-09-26); the
  # browser driver capture.mjs and the committed build-lessons/yaml-lite are outside the include.
  learn-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: ffmpeg (assemble.sh + check.sh run for real in assemble.test.mjs)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: tools/learn tests, with coverage
        run: |
          node --test --experimental-test-coverage \
            --test-coverage-include='tools/learn/{all-plan,assemble-plan,capture-lib,capture-venue,check,publish}.mjs' \
            --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100 \
            tools/learn/*.test.mjs
      - name: the ffmpeg leg did run (a skipped end-to-end test would pass the step above)
        run: node --test --test-name-pattern='assemble.sh \+ check.sh end to end' tools/learn/assemble.test.mjs 2>&1 | tee /tmp/e2e.txt && grep -q '^# pass 1' /tmp/e2e.txt && ! grep -q '# SKIP' /tmp/e2e.txt

  # THE WORKER, COMPILED FOR WHAT IT RUNS ON. The distro rustc on the dev box cannot build wasm32;
  # the pinned upstream toolchain can. A native `cargo test` does not prove the wasm32 build links.
  wasm32:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '${{ env.RUST_TOOLCHAIN }}', targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: workers/api }
      - name: workers/api for wasm32-unknown-unknown
        run: cd workers/api && cargo build --release --target wasm32-unknown-unknown

  # THE COURIER'S OFFLINE QUEUE, IN A REAL BROWSER. Served from disk over loopback with a counting
  # stub for /api/: half of what it proves is a refusal being REPLAYED, and proving that against a
  # real restaurant would be the bug. `playwright` is the one library it needs (no @playwright/test).
  offline-writes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # NOT fetch-depth 1: the RED half serves the courier app as it was BEFORE the outbox, out of
      # the commit that last shipped it, and clicks the real button on it.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # There is no root package.json; the library is installed where node's resolution finds it
      # from e2e/, pinned to the version the tree was written against.
      - name: install playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: the outbox replays a queued tap once
        run: node e2e/kit-regression/outbox.mjs
      - name: the courier app reopens with no network
        run: node e2e/kit-regression/courier-cold.mjs

  # deny.toml bans yanked crates, wildcards and disallowed licences. A config is not a gate; this is.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '${{ env.RUST_TOOLCHAIN }}' }
      - name: install cargo-deny
        run: cargo install --locked cargo-deny
      - name: cargo deny check (dowiz-core)
        run: cargo deny --manifest-path crates/dowiz-core/Cargo.toml check

  # Tested, not served to a venue: the std facade, the render engine, the native courier surface.
  legacy-crates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '${{ env.RUST_TOOLCHAIN }}' }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel
            engine
            apps/courier
      - run: cd kernel && cargo test --lib
      - run: cd engine && cargo test --lib
      - run: cd apps/courier && cargo test
