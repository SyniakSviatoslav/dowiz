name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cd kernel && cargo test --lib
      - run: cd engine && cargo test --lib
      - run: cd apps/courier && cargo test

  # THE CRATES THE LIVE PRODUCT IS MADE OF. `test` above runs the kernel, the
  # engine and the courier app; until this job existed nothing ran the order
  # log, the storage format, the tables that replaced D1, or a single Worker
  # route. Four hundred and fifty tests, no gate. Mirrors scripts/verify-hub.sh.
  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No workspace: each crate is standalone and is entered on purpose.
      - run: cd crates/bebop-store && cargo test
      - run: cd crates/dowiz-core && cargo test
      - run: cd crates/dowiz-hub && cargo test
      - run: cd workers/api && cargo test
      - name: the SQL ratchet (may only fall)
        run: sh tools/gates/no-sql.sh
      - name: the file-size ratchet (may only fall)
        run: sh tools/gates/file-size.sh
      - name: one venue per request (may only fall)
        run: sh tools/gates/one-venue.sh
      # The conservation audit itself needs live venues and an owner token, so
      # it cannot run here. Its PROOF can: the gate is run against a stubbed
      # platform and each law is checked for going red when it should and
      # green when it should not. A gate whose alarm has never been heard is
      # the failure this repo keeps a catalogue of.
      - name: the conservation gate fires as described
        run: node e2e/gates/conservation.prove.mjs

  mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-mutants
      - run: cd kernel && cargo mutants --in-package dowiz-kernel --file src/trinary.rs --file src/eigen.rs --file src/pid.rs --file src/numerical_guard.rs --file src/delta.rs --timeout 30

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz
      - run: cd kernel && for target in fuzz_trinary fuzz_eigen fuzz_sanitize; do timeout 60 cargo fuzz run $target -- -max_total_time=30; done
