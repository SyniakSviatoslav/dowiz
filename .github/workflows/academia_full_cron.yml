# .github/workflows/academia_full_cron.yml — LEGACY, switched off 2026-10-02 (operator: "так, виправ").
#
# This file promised "20 parallel bots, ~1M papers per run, ~4M/day" on a 6-hourly cron. It NEVER RAN:
# its matrix lines were written `- source: arxiv  set: cs`, which is not valid YAML (a second key on the
# same line), so GitHub rejected the workflow file. Had it parsed, each job would have executed
#     curl -sL "https://hf.co/datasets/Delulu12/academia-matrix/resolve/main/bot.sh" | bash
# with HF_TOKEN in its environment: whoever can change bot.sh in that dataset runs code in this CI.
# It is kept, not deleted (operator 2026-10-02: nothing is deleted), with the schedule removed, the
# matrix made valid, and the remote-script step replaced by a refusal that says why.
# The honest replacement is .github/workflows/academia-extract.yml (manual, OAI-PMH, full records).

name: Academia Full Extraction (LEGACY, refused)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { source: arxiv, set: cs }
    steps:
      - name: Refuse — this job piped a remote script into bash with HF_TOKEN
        run: |
          echo "academia_full_cron: REFUSED (2026-10-02). It ran 'curl .../bot.sh | bash' from a"
          echo "Hugging Face dataset with HF_TOKEN set. Use the 'Academia harvest (manual)' workflow"
          echo "(.github/workflows/academia-extract.yml) instead."
          exit 1
