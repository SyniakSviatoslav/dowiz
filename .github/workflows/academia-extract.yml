# .github/workflows/academia-extract.yml — honest arXiv harvest, run by hand.
#
# REWRITTEN 2026-10-02 (operator: "так, виправ"). What this file did until then, and why it stopped:
#   - ran every Monday on a cron and hid its pattern: random sleeps, "chaff" requests to httpbin/google,
#     a spoofed Chrome User-Agent and rotated Accept-Language — masking itself from arXiv, which offers
#     open OAI-PMH access to anyone who says who they are;
#   - kept only an 8-byte SHA3 prefix of each TITLE (no title, abstract, authors or id survive);
#   - "signed" each chunk with "ML-DSA-65 (sim)": sha3(random key + data), the key thrown away, and a
#     "verify" that checked the length was 64 — a fake crypto primitive, which CLAUDE.md forbids;
#   - uploaded to the Hugging Face dataset Delulu12/academia-matrix, whose chunks/ folder was EMPTY when
#     checked on 2026-10-02 (last change 2026-07-21): the only matrix there is the July one-off
#     academia_v1_matrix.bin (547,536 title hashes; copy in tools/academia_matrix_v1.bin).
# Now: manual dispatch only, no secret, no masking, full records via tools/research-extract.sh --oai
# (tools/research_oai.py honours arXiv's 503/Retry-After and waits 3 s between requests), citations by
# tools/research_cite.py (null when Semantic Scholar does not answer, never 0). The corpus is a
# workflow artifact.

name: Academia harvest (manual)

on:
  workflow_dispatch:
    inputs:
      set:
        description: 'arXiv OAI set (cs, math, stat, physics, q-bio, eess, econ, q-fin)'
        default: 'cs'
      from:
        description: 'From datestamp YYYY-MM-DD (inclusive)'
        required: true
      until:
        description: 'Until datestamp YYYY-MM-DD (inclusive)'
        required: true
      max:
        description: 'Maximum records'
        default: '5000'

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - name: Harvest arXiv over OAI-PMH
        env:
          SET: ${{ inputs.set }}
          FROM: ${{ inputs.from }}
          UNTIL: ${{ inputs.until }}
          MAX: ${{ inputs.max }}
        run: |
          bash tools/research-extract.sh --oai "$SET" --from "$FROM" --until "$UNTIL" \
            --max "$MAX" --output "arxiv-$SET-$FROM-$UNTIL.jsonl"
          wc -l "arxiv-$SET-$FROM-$UNTIL.jsonl"
      - uses: actions/upload-artifact@v6
        with:
          name: arxiv-${{ inputs.set }}-${{ inputs.from }}-${{ inputs.until }}
          path: arxiv-*.jsonl
          retention-days: 30
