name: QA nightly

# THE ARCHIVED-ORDER CHECK (e2e/archive/archived-order.mjs), NIGHTLY, AGAINST A LOCAL qa-durres HUB.
#
# NO REPOSITORY SECRETS. The job builds the Worker from this commit and runs it under `wrangler dev --local`
# (workerd on the runner: no Cloudflare account, no token, nothing leaves the runner). tools/ci/local-qa-hub.sh
# does the whole thing, and runs identically on the development box:
#   1. build the Worker (worker-build --release, the repo's pinned rustc 1.96.1, wasm32);
#   2. generate a RANDOM BOOTSTRAP_SECRET and a random owner password for this run only, written to
#      workers/api/.dev.vars (wrangler's local secrets file, deleted on exit) and a 0600 owner file. Never committed;
#   3. `wrangler dev --local` on 127.0.0.1, fresh state each run;
#   4. seed the venue qa-durres, its first owner (POST /api/bootstrap, with the random secret) and one dish on sale
#      (tools/ci/qa-hub-seed.mjs);
#   5. run e2e/archive/archived-order.mjs unchanged, with FLOWS_HOST=http://127.0.0.1:<port> and FLOWS_LOC=qa-durres.
#
# WHAT THE CHECK PROVES, ON THE LOCAL HUB. The rotation moves every finished order of qa-durres into the archive.
# Then the receipt is read from the archive (200, names the dish), a refund is refused by name (409) and writes
# nothing, and an unknown id is still 404. The settings it touches (tax rate, pickup) are put back in `finally`.
#
# WHY LOCAL, NOT THE QA HUB. The check used to run against qa-durres.dowiz.org with the owner's login in repository
# secrets, and failed on the missing secrets. The operator will not set them, and a skip is not a pass, so the
# check now owns its own hub for the length of one run. The live QA hub is not written by this job.
#
# RED IS RED. A failing build, a Worker that does not answer, a seed that cannot sign in, or a failing assertion
# each fail the job, and the summary shows the log. Nothing here skips.
#
# FAILURE MODES THIS DOES NOT COVER. Live-only behaviour (Cloudflare's own routing, the custom domain, the
# workers.dev edge cache, R2 and KV as they run in production) is checked by the live probes, not by this job.

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
  # A change to this job or its scripts proves itself on a runner at once (the box cannot run workerd).
  push:
    branches: [main]
    paths:
      - .github/workflows/qa-nightly.yml
      - tools/ci/**
      - e2e/archive/**

permissions:
  contents: read

concurrency:
  group: qa-nightly
  cancel-in-progress: false

jobs:
  archived-order:
    runs-on: ubuntu-latest
    # A cold worker-build plus `cargo install worker-build` plus wrangler's install and the check itself.
    timeout-minutes: 60
    env:
      QA_HUB_NO_SLOT: '1'
      QA_HUB_PORT: '8787'
      QA_HUB_WORK: ${{ runner.temp }}/qa-hub
      QA_HUB_LOG: ${{ runner.temp }}/archived.log
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workers/api
      - name: local QA hub and the archived-order check
        run: bash tools/ci/local-qa-hub.sh
      - name: summary
        if: always()
        run: |
          { echo '### QA nightly: archived order (local qa-durres hub)'; echo; echo '```'; cat "$QA_HUB_LOG" 2>/dev/null || echo '(no output: the local hub did not get as far as the check)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: keep the logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qa-nightly-logs
          path: |
            ${{ runner.temp }}/qa-hub/*.log
            ${{ runner.temp }}/archived.log
          if-no-files-found: ignore
          retention-days: 14
