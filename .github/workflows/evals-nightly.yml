name: Evals nightly

# THE NIGHTLY SUITE (BLUEPRINT-OPTIMIZATION-AND-EVALS-2026-09-24 §B.3): GET-only probes of the live
# venues (median of three for every clock), each venue's health and product aggregates, the four
# surfaces in a headless Chromium at 360 and 1280 px, and the cost model priced from Cloudflare's
# own request counts. It places NO order: the order suite reads a traffic.mjs report only when one
# is handed to it (collect/order.mjs says why). Never writes to a venue.
#
# Secrets (all optional; a missing one turns its indicators UNVERIFIED, never green):
#   EVALS_OWNER_EMAIL / EVALS_OWNER_PASSWORD   owner sign-in for /api/owner/{health,orders,reservations}
#   CF_ANALYTICS_ACCOUNT_ID / CF_ANALYTICS_TOKEN   Account Analytics:Read only
#
# The box runs the same suite without GitHub (docs/measurements/evals/README.md).

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: a headless Chromium
        run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: the nightly suite
        env:
          OWNER_EMAIL: ${{ secrets.EVALS_OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.EVALS_OWNER_PASSWORD }}
          CF_ACCOUNT: ${{ secrets.CF_ANALYTICS_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            printf 'CLOUDFLARE_ACCOUNT_ID=%s\nCLOUDFLARE_API_TOKEN=%s\n' "$CF_ACCOUNT" "$CF_TOKEN" > "$RUNNER_TEMP/cf"
            export CF_ANALYTICS_FILE="$RUNNER_TEMP/cf"
          fi
          node tools/evals/run.mjs --suite nightly --no-baseline-write
      - name: the report, in the job summary
        if: always()
        run: cat docs/measurements/evals/*-nightly.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-nightly
          path: docs/measurements/evals/
