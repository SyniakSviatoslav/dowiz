# Lesson O19 (owner). The ONE source for the in-app tour (/lib/learn.js, via
# tools/learn/build-lessons.mjs -> workers/api/public/learn/lessons.json) and for the recorder,
# which drives each step's `action` and burns its `title`/`caption` in as the subtitles.
# `pending: yes` = the anchor is named by the blueprint but not yet in the markup (tools/gates/learn.sh).
# The phrases below are the ones the hub's grammar is tested on
# (workers/api/src/services/engagement/voice/grammar/tests.rs `the_lessons_phrases_work`).
id: O19
role: owner
module: voice
order: 36
covers: []
title:
  sq: "Me zë"
  en: "By voice"
  uk: "Голосом"
goal:
  sq: "Pranoni, refuzoni dhe hiqni pjata nga shitja pa prekur ekranin — gjithmonë me konfirmim."
  en: "Accept, reject and take dishes off sale without touching the screen — always with a confirm."
  uk: "Приймати, відхиляти й знімати страви з продажу, не торкаючись екрана, — завжди з підтвердженням."
steps:
  - key: 1
    anchor: hud.voice
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="hud.voice"]'
    title:
      sq: "Mikrofoni"
      en: "The microphone"
      uk: "Мікрофон"
    caption:
      sq: "Prekeni dhe flisni. Porositë: «prano të fundit», «gati 4821», «refuzo 4821», «sa janë në pritje». Shfaqet vetëm aty ku shfletuesi e njeh zërin."
      en: "Tap it and speak. Orders: «accept the last one», «ready 4821», «reject 4821», «how many are waiting». It shows only where the browser can recognise speech."
      uk: "Торкніться й говоріть. Замовлення: «прийми останнє», «готово 4821», «відхили 4821», «скільки чекає». Видно лише там, де браузер розпізнає голос."
  - key: 2
    anchor: voice.readback
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="voice.readback"]'
    title:
      sq: "Çfarë u kuptua"
      en: "What was understood"
      uk: "Що зрозуміло"
    caption:
      sq: "Menyja dhe lokali: «hiq margaritën nga menuja», «rikthe margaritën», «lokali i zënë», «mbyll lokalin». Lokali e lexon me zë atë që kuptoi."
      en: "Menu and venue: «margherita is off», «put margherita back on sale», «venue busy», «close the venue». The hub reads back what it understood."
      uk: "Меню й заклад: «зніми маргариту з продажу», «поверни маргариту в продаж», «заклад зайнятий», «закрий заклад». Хаб читає вголос, що зрозумів."
  - key: 3
    anchor: voice.reason
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="voice.reason"]'
    title:
      sq: "Arsyeja"
      en: "The reason"
      uk: "Причина"
    caption:
      sq: "Një refuzim ose anulim merr një arsye, si te butoni."
      en: "A rejection or a cancellation carries a reason, as the button does."
      uk: "Відмова чи скасування має причину, як і з кнопки."
  - key: 4
    anchor: voice.confirm
    pending: no
    writes: yes
    action:
      do: wait
      selector: '[data-tour="voice.confirm"]'
    title:
      sq: "Konfirmoni"
      en: "Confirm"
      uk: "Підтвердіть"
    caption:
      sq: "Asgjë nuk ndryshon pa këtë buton. Një numër që i përshtatet dy porosive ose një pjatë me dy emra refuzohet — thoni më shumë."
      en: "Nothing changes without this button. A number that fits two orders, or a dish two names fit, is refused — say more."
      uk: "Без цієї кнопки нічого не змінюється. Номер, що підходить двом замовленням, або назва двох страв — відмова: скажіть точніше."
  - key: 5
    anchor: voice.cancel
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="voice.cancel"]'
    title:
      sq: "Ose jo"
      en: "Or not"
      uk: "Або ні"
    caption:
      sq: "Anulo e lë gjithçka si ishte. Leximi skadon pas 90 sekondash."
      en: "Cancel leaves everything as it was. A read-back expires after 90 seconds."
      uk: "Скасувати — усе лишається як було. Прочитане діє 90 секунд."
