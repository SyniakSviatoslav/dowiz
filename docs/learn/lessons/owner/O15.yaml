# Lesson O15 (owner). The ONE source for the in-app tour (/lib/learn.js, via
# tools/learn/build-lessons.mjs -> workers/api/public/learn/lessons.json) and for the recorder,
# which drives each step's `action` and burns its `title`/`caption` in as the subtitles.
# `pending: yes` = the anchor is named by the blueprint but not yet in the markup (tools/gates/learn.sh).
id: O15
role: owner
module: stamps
order: 26
covers: [features]
title:
  sq: "Karta me vula"
  en: "The stamp card"
  uk: "Картка з печатками"
  ru: "Карточка с печатями"
goal:
  sq: "Aktivizojeni me 8 vula."
  en: "Switch it on with 8 stamps."
  uk: "Увімкнути з 8 печатками."
  ru: "Включить с 8 печатями."
steps:
  - key: 1
    anchor: more.tile.features
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="more.tile.features"]'
    title:
      sq: "Funksionet"
      en: "Features"
      uk: "Функції"
      ru: "Функции"
    caption:
      sq: "Funksionet ndezin e fikin pjesë të faqes. Karta me vula ka cilësimet e veta, te Promocionet."
      en: "Features switch parts of the site on and off. The stamp card has its own settings, under Promos."
      uk: "Функції вмикають і вимикають частини сайту. Картка з печатками має власні налаштування — у Промоакціях."
      ru: "Функции включают и выключают части сайта. У карточки с печатями свои настройки — в Промоакциях."
  - key: 2
    anchor: more.tile.promos
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="more.tile.promos"]'
    title:
      sq: "Promocionet"
      en: "Promos"
      uk: "Промоакції"
      ru: "Промоакции"
    caption:
      sq: "Karta me vula është poshtë kodeve promocionale."
      en: "The stamp card sits below the promo codes."
      uk: "Картка з печатками — під промокодами."
      ru: "Карточка с печатями — под промокодами."
  - key: 3
    anchor: stamps.count
    pending: no
    writes: no
    action:
      do: type
      selector: '[data-tour="stamps.count"]'
      value: "8"
    title:
      sq: "Sa vula"
      en: "How many stamps"
      uk: "Скільки печаток"
      ru: "Сколько печатей"
    caption:
      sq: "P.sh. 8 porosi për një dhuratë."
      en: "For example 8 orders for a reward."
      uk: "Наприклад, 8 замовлень за винагороду."
      ru: "Например, 8 заказов за награду."
  - key: 4
    anchor: stamps.reward
    pending: no
    writes: no
    action:
      do: type
      selector: '[data-tour="stamps.reward"]'
      value: "1000"
    title:
      sq: "Zbritja"
      en: "The discount"
      uk: "Знижка"
      ru: "Скидка"
    caption:
      sq: "Sa zbret karta e plotë nga porosia e radhës — klienti e sheh në faqen e porosisë."
      en: "How much a full card takes off the next order — the customer sees it on their order page."
      uk: "Скільки повна картка знімає з наступного замовлення — клієнт бачить це на сторінці замовлення."
      ru: "Сколько полная карточка снимает со следующего заказа — клиент видит это на странице заказа."
  - key: 5
    anchor: stamps.save
    pending: no
    writes: yes
    action:
      do: click
      selector: '[data-tour="stamps.save"]'
    title:
      sq: "Ruaj"
      en: "Save"
      uk: "Зберегти"
      ru: "Сохранить"
    caption:
      sq: "Karta del në faqe."
      en: "The card appears on the site."
      uk: "Картка з’являється на сайті."
      ru: "Карточка появляется на сайте."
