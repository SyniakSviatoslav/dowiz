# Lesson O16c (owner). The ONE source for the in-app tour (/lib/learn.js, via
# tools/learn/build-lessons.mjs -> workers/api/public/learn/lessons.json) and for the recorder,
# which drives each step's `action` and burns its `title`/`caption` in as the subtitles.
# `pending: yes` = the anchor is named by the blueprint but not yet in the markup (tools/gates/learn.sh).
id: O16c
role: owner
module: integrations
order: 32
covers: [integrations, channels, health]
title:
  sq: "Integrimet, kanalet, shëndeti"
  en: "Integrations, channels, health"
  uk: "Інтеграції, канали, стан"
  ru: "Интеграции, каналы, состояние"
goal:
  sq: "Shtypni «kontrollo të gjitha» dhe lexoni faqen e shëndetit."
  en: "Run “check all” and read the health page."
  uk: "Запустити «перевірити все» й прочитати сторінку стану."
  ru: "Запустить «проверить всё» и прочитать страницу состояния."
steps:
  - key: 1
    anchor: more.tile.integrations
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="more.tile.integrations"]'
    title:
      sq: "Integrimet"
      en: "Integrations"
      uk: "Інтеграції"
      ru: "Интеграции"
    caption:
      sq: "Çdo lidhje me jashtë, me gjendjen e saj."
      en: "Every outside link, with its state."
      uk: "Кожен зовнішній зв’язок і його стан."
      ru: "Каждая внешняя связь и её состояние."
  - key: 2
    anchor: integrations.check
    pending: no
    writes: yes
    action:
      do: click
      selector: '[data-tour="integrations.check"]'
    title:
      sq: "Kontrollo të gjitha"
      en: "Check all"
      uk: "Перевірити все"
      ru: "Проверить всё"
    caption:
      sq: "Provon çdo lidhje tani dhe tregon çfarë nuk punon."
      en: "Tries every link now and shows what does not work."
      uk: "Перевіряє кожен зв’язок зараз і показує, що не працює."
      ru: "Проверяет каждую связь сейчас и показывает, что не работает."
