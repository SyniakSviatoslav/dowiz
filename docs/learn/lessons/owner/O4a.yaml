# Lesson O4a (owner). The ONE source for the in-app tour (/lib/learn.js, via
# tools/learn/build-lessons.mjs -> workers/api/public/learn/lessons.json) and for the recorder,
# which drives each step's `action` and burns its `title`/`caption` in as the subtitles.
# `pending: yes` = the anchor is named by the blueprint but not yet in the markup (tools/gates/learn.sh).
id: O4a
role: owner
module: menu
order: 6
covers: [menu]
title:
  sq: "Kategoritë dhe pjatat e reja"
  en: "Categories and new dishes"
  uk: "Категорії та нові страви"
goal:
  sq: "Krijoni një kategori dhe vendosni në shitje një pjatë të re."
  en: "Create a category and put a new dish on sale."
  uk: "Створити категорію й виставити в продаж нову страву."
steps:
  - key: 1
    anchor: nav.menu
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="nav.menu"]'
    title:
      sq: "Menuja"
      en: "Menu"
      uk: "Меню"
    caption:
      sq: "Kategoritë dhe pjatat, siç i shohin klientët."
      en: "Categories and dishes, as customers see them."
      uk: "Категорії та страви — так, як їх бачать клієнти."
  - key: 2
    anchor: menu.categories
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="menu.categories"]'
    title:
      sq: "Kategoritë"
      en: "Categories"
      uk: "Категорії"
    caption:
      sq: "Rendi këtu është rendi në faqe."
      en: "The order here is the order on the site."
      uk: "Порядок тут — це порядок на сайті."
  - key: 3
    anchor: menu.category
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="menu.category"]'
    title:
      sq: "Një kategori"
      en: "A category"
      uk: "Категорія"
    caption:
      sq: "Prekeni për ta riemërtuar ose hequr."
      en: "Tap it to rename or remove it."
      uk: "Торкніться, щоб перейменувати чи прибрати."
  - key: 4
    anchor: category.name
    pending: no
    writes: no
    action:
      do: type
      selector: '[data-tour="category.name"]'
      value: "Supa"
    title:
      sq: "Emri"
      en: "The name"
      uk: "Назва"
    caption:
      sq: "Emri që sheh klienti."
      en: "The name the customer sees."
      uk: "Назва, яку бачить клієнт."
  - key: 5
    anchor: category.save
    pending: no
    writes: yes
    action:
      do: click
      selector: '[data-tour="category.save"]'
    title:
      sq: "Ruaj"
      en: "Save"
      uk: "Зберегти"
    caption:
      sq: "Ndryshimi del menjëherë në faqe."
      en: "The change is on the site at once."
      uk: "Зміна одразу з’являється на сайті."
  - key: 6
    anchor: category.remove
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="category.remove"]'
    title:
      sq: "Hiqe"
      en: "Remove"
      uk: "Прибрати"
    caption:
      sq: "Vetëm një kategori bosh hiqet."
      en: "Only an empty category can be removed."
      uk: "Прибрати можна лише порожню категорію."
  - key: 7
    anchor: menu.newCategory
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="menu.newCategory"]'
    title:
      sq: "Kategori e re"
      en: "New category"
      uk: "Нова категорія"
    caption:
      sq: "Shkruani emrin…"
      en: "Type its name…"
      uk: "Введіть назву…"
  - key: 8
    anchor: menu.addCategory
    pending: no
    writes: yes
    action:
      do: click
      selector: '[data-tour="menu.addCategory"]'
    title:
      sq: "Shtoje"
      en: "Add it"
      uk: "Додати"
    caption:
      sq: "…dhe shtojeni në fund."
      en: "…and add it at the end."
      uk: "…і додайте в кінець."
  - key: 9
    anchor: menu.sort
    pending: no
    writes: yes
    action:
      do: click
      selector: '[data-tour="menu.sort"]'
    title:
      sq: "Renditja"
      en: "Order"
      uk: "Порядок"
    caption:
      sq: "Lëvizni kategoritë lart e poshtë."
      en: "Move categories up and down."
      uk: "Пересувайте категорії вгору й униз."
  - key: 10
    anchor: menu.addDish
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="menu.addDish"]'
    title:
      sq: "Pjatë e re"
      en: "New dish"
      uk: "Нова страва"
    caption:
      sq: "Tre gjëra mjaftojnë për ta vendosur në shitje."
      en: "Three things are enough to put it on sale."
      uk: "Трьох речей досить, щоб виставити її в продаж."
  - key: 11
    anchor: newDish.name
    pending: no
    writes: no
    action:
      do: type
      selector: '[data-tour="newDish.name"]'
      value: "Supë miso"
    title:
      sq: "Emri"
      en: "The name"
      uk: "Назва"
    caption:
      sq: "Përkthimet i shtoni më vonë."
      en: "You add the translations later."
      uk: "Переклади додасте пізніше."
  - key: 12
    anchor: newDish.category
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="newDish.category"]'
    title:
      sq: "Kategoria"
      en: "The category"
      uk: "Категорія"
    caption:
      sq: "Ku shfaqet në menu."
      en: "Where it shows on the menu."
      uk: "Де вона з’явиться в меню."
  - key: 13
    anchor: newDish.price
    pending: no
    writes: no
    action:
      do: type
      selector: '[data-tour="newDish.price"]'
      value: "450"
    title:
      sq: "Çmimi"
      en: "The price"
      uk: "Ціна"
    caption:
      sq: "Në lekë."
      en: "In lek."
      uk: "У леках."
  - key: 14
    anchor: newDish.save
    pending: no
    writes: yes
    action:
      do: click
      selector: '[data-tour="newDish.save"]'
    title:
      sq: "Ruaj"
      en: "Save"
      uk: "Зберегти"
    caption:
      sq: "Pjata është në shitje."
      en: "The dish is on sale."
      uk: "Страва в продажу."
