# Lesson O4d (owner). The ONE source for the in-app tour (/lib/learn.js, via
# tools/learn/build-lessons.mjs -> workers/api/public/learn/lessons.json) and for the recorder,
# which drives each step's `action` and burns its `title`/`caption` in as the subtitles.
# `pending: yes` = the anchor is named by the blueprint but not yet in the markup (tools/gates/learn.sh).
id: O4d
role: owner
module: menu
order: 7
covers: []
title:
  sq: "Ndryshoni një pjatë"
  en: "Edit a dish"
  uk: "Змініть страву"
  ru: "Измените блюдо"
goal:
  sq: "Vendosni foto, çmim, stacion dhe përkthime, ose hiqeni nga shitja."
  en: "Set a photo, price, station and translations, or take it off sale."
  uk: "Додати фото, ціну, станцію й переклади або зняти з продажу."
  ru: "Добавить фото, цену, станцию и переводы или снять с продажи."
steps:
  - key: 1
    anchor: menu.dish
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="menu.dish"]'
    title:
      sq: "Një pjatë"
      en: "A dish"
      uk: "Страва"
      ru: "Блюдо"
    caption:
      sq: "Prekni pjatën për ta ndryshuar."
      en: "Tap the dish to edit it."
      uk: "Торкніться страви, щоб її змінити."
      ru: "Коснитесь блюда, чтобы его изменить."
  - key: 2
    anchor: dish.price
    pending: no
    writes: no
    action:
      do: type
      selector: '[data-tour="dish.price"]'
      value: "1200"
    title:
      sq: "Çmimi"
      en: "The price"
      uk: "Ціна"
      ru: "Цена"
    caption:
      sq: "Çmimi i ri vlen për porositë e reja."
      en: "The new price applies to new orders."
      uk: "Нова ціна діє для нових замовлень."
      ru: "Новая цена действует для новых заказов."
  - key: 3
    anchor: dish.photo
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="dish.photo"]'
    title:
      sq: "Foto"
      en: "Photo"
      uk: "Фото"
      ru: "Фото"
    caption:
      sq: "Fotoja që sheh klienti."
      en: "The photo the customer sees."
      uk: "Фото, яке бачить клієнт."
      ru: "Фото, которое видит клиент."
  - key: 4
    anchor: dish.photoFile
    pending: no
    writes: yes
    action:
      do: click
      selector: '[data-tour="dish.photoFile"]'
    title:
      sq: "Ngarko foto"
      en: "Upload a photo"
      uk: "Завантажити фото"
      ru: "Загрузить фото"
    caption:
      sq: "Zvogëlohet dhe pastrohet nga të dhënat e vendndodhjes para ngarkimit."
      en: "It is shrunk and stripped of location data before it uploads."
      uk: "Зменшується й очищається від даних про місце перед завантаженням."
      ru: "Уменьшается и очищается от данных о месте перед загрузкой."
  - key: 5
    anchor: dish.photoClear
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="dish.photoClear"]'
    title:
      sq: "Hiq foton"
      en: "Remove the photo"
      uk: "Прибрати фото"
      ru: "Убрать фото"
    caption:
      sq: "Pjata mbetet pa foto."
      en: "The dish stays without a photo."
      uk: "Страва лишається без фото."
      ru: "Блюдо остаётся без фото."
  - key: 6
    anchor: dish.offNote
    pending: no
    writes: no
    action:
      do: type
      selector: '[data-tour="dish.offNote"]'
      value: "Nesër"
    title:
      sq: "Pse s’ka"
      en: "Why it is off"
      uk: "Чому немає"
      ru: "Почему нет"
    caption:
      sq: "Kur e hiqni nga shitja, një fjalë për klientin — p.sh. «nesër»."
      en: "When it is off sale, a word for the customer — for example “tomorrow”."
      uk: "Коли страву знято з продажу — слово для клієнта, наприклад «завтра»."
      ru: "Когда блюдо снято с продажи — слово для клиента, например «завтра»."
  - key: 7
    anchor: dish.station
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="dish.station"]'
    title:
      sq: "Stacioni"
      en: "The station"
      uk: "Станція"
      ru: "Станция"
    caption:
      sq: "Kuzhina apo bari — ku printohet fleta."
      en: "Kitchen or bar — where its ticket prints."
      uk: "Кухня чи бар — де друкується чек."
      ru: "Кухня или бар — где печатается чек."
  - key: 8
    anchor: dish.tag
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="dish.tag"]'
    title:
      sq: "Etiketat"
      en: "Tags"
      uk: "Мітки"
      ru: "Метки"
    caption:
      sq: "Vegjetariane, pikante… klienti filtron me to."
      en: "Vegetarian, spicy… customers filter by them."
      uk: "Вегетаріанське, гостре… клієнти фільтрують за ними."
      ru: "Вегетарианское, острое… клиенты фильтруют по ним."
  - key: 9
    anchor: dish.ingredients
    pending: no
    writes: no
    action:
      do: type
      selector: '[data-tour="dish.ingredients"]'
      value: "salmon, oriz, nori"
    title:
      sq: "Përbërësit"
      en: "Ingredients"
      uk: "Склад"
      ru: "Состав"
    caption:
      sq: "Përbërësit dhe alergjenët që sheh klienti."
      en: "The ingredients and allergens the customer sees."
      uk: "Склад і алергени, які бачить клієнт."
      ru: "Состав и аллергены, которые видит клиент."
  - key: 10
    anchor: dish.translation
    pending: no
    writes: no
    action:
      do: type
      selector: '[data-tour="dish.translation"]'
      value: "Salmon roll"
    title:
      sq: "Përkthimet"
      en: "Translations"
      uk: "Переклади"
      ru: "Переводы"
    caption:
      sq: "Emri dhe përshkrimi në anglisht, ukrainisht dhe rusisht."
      en: "The name and description in English, Ukrainian and Russian."
      uk: "Назва й опис англійською, українською та російською."
      ru: "Название и описание на английском, украинском и русском."
  - key: 11
    anchor: dish.save
    pending: no
    writes: yes
    action:
      do: click
      selector: '[data-tour="dish.save"]'
    title:
      sq: "Ruaj"
      en: "Save"
      uk: "Зберегти"
      ru: "Сохранить"
    caption:
      sq: "Ndryshimet dalin menjëherë në faqe."
      en: "The changes are on the site at once."
      uk: "Зміни одразу з’являються на сайті."
      ru: "Изменения сразу появляются на сайте."
  - key: 12
    anchor: dish.delete
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="dish.delete"]'
    title:
      sq: "Fshije"
      en: "Delete"
      uk: "Видалити"
      ru: "Удалить"
    caption:
      sq: "Fshirja nuk kthehet. Heqja nga shitja zakonisht mjafton."
      en: "Deleting cannot be undone. Taking it off sale is usually enough."
      uk: "Видалення не скасувати. Зазвичай досить зняти з продажу."
      ru: "Удаление не отменить. Обычно достаточно снять с продажи."
