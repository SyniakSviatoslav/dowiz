# Lesson O16f (owner). The ONE source for the in-app tour (/lib/learn.js, via
# tools/learn/build-lessons.mjs -> workers/api/public/learn/lessons.json) and for the recorder,
# which drives each step's `action` and burns its `title`/`caption` in as the subtitles.
# `pending: yes` = the anchor is named by the blueprint but not yet in the markup (tools/gates/learn.sh).
id: O16f
role: owner
module: notifications
order: 30
covers: [notifications, printer]
title:
  sq: "Zilja e kuzhinës dhe printeri"
  en: "The kitchen bell and the printer"
  uk: "Дзвінок кухні та принтер"
  ru: "Звонок кухни и принтер"
goal:
  sq: "Lidhni Telegram-in dhe provoni ziljen; lidhni printerin."
  en: "Connect Telegram and test the bell; connect the printer."
  uk: "Підключити Telegram і перевірити дзвінок; підключити принтер."
  ru: "Подключить Telegram и проверить звонок; подключить принтер."
steps:
  - key: 1
    anchor: more.tile.notifications
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="more.tile.notifications"]'
    title:
      sq: "Zilja"
      en: "The bell"
      uk: "Дзвінок"
      ru: "Звонок"
    caption:
      sq: "Ku bie njoftimi për çdo porosi të re."
      en: "Where each new order rings."
      uk: "Куди дзвонить кожне нове замовлення."
      ru: "Куда звонит каждый новый заказ."
  - key: 2
    anchor: notify.telegram
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="notify.telegram"]'
    title:
      sq: "Ekrani i Telegramit"
      en: "The Telegram screen"
      uk: "Екран Telegram"
      ru: "Экран Telegram"
    caption:
      sq: "Telegrami ka ekranin e vet: boti, grupet dhe çfarë shkon ku."
      en: "Telegram has its own screen: the bot, the groups, and what goes where."
      uk: "Telegram має власний екран: бот, групи і що куди надходить."
      ru: "У Telegram свой экран: бот, группы и что куда приходит."
  - key: 3
    anchor: notify.telegramState
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="notify.telegramState"]'
    title:
      sq: "Telegram"
      en: "Telegram"
      uk: "Telegram"
      ru: "Telegram"
    caption:
      sq: "A është lidhur boti i lokalit."
      en: "Whether the venue’s own bot is connected."
      uk: "Чи підключено власного бота закладу."
      ru: "Подключён ли собственный бот заведения."
  - key: 4
    anchor: notify.tgToken
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="notify.tgToken"]'
    title:
      sq: "Çelësi i botit"
      en: "Bot token"
      uk: "Токен бота"
      ru: "Токен бота"
    caption:
      sq: "Nga boti juaj; mbetet i fshehur."
      en: "From your own bot; it stays hidden."
      uk: "Від вашого бота; лишається прихованим."
      ru: "От вашего бота; остаётся скрытым."
  - key: 5
    anchor: notify.tgChat
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="notify.tgChat"]'
    title:
      sq: "Lidh një grup"
      en: "Connect a group"
      uk: "Підключити групу"
      ru: "Подключить группу"
    caption:
      sq: "Lidh një grup: shto botin, dërgo /link KODI."
      en: "Connect a group: add the bot, send /link CODE."
      uk: "Підключіть групу: додайте бота, надішліть /link КОД."
      ru: "Подключите группу: добавьте бота, отправьте /link КОД."
  - key: 6
    anchor: notify.test
    pending: no
    writes: yes
    action:
      do: click
      selector: '[data-tour="notify.test"]'
    title:
      sq: "Provë"
      en: "Test"
      uk: "Перевірка"
      ru: "Проверка"
    caption:
      sq: "Dërgon një njoftim prove — duhet të bjerë në kuzhinë."
      en: "Sends a test notice — it should ring in the kitchen."
      uk: "Надсилає тестове сповіщення — воно має задзвонити на кухні."
      ru: "Отправляет тестовое уведомление — оно должно зазвонить на кухне."
  - key: 7
    anchor: notify.whatsappState
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="notify.whatsappState"]'
    title:
      sq: "WhatsApp"
      en: "WhatsApp"
      uk: "WhatsApp"
      ru: "WhatsApp"
    caption:
      sq: "Ose përmes WhatsApp-it të biznesit."
      en: "Or through WhatsApp Business."
      uk: "Або через WhatsApp Business."
      ru: "Или через WhatsApp Business."
  - key: 8
    anchor: notify.waToken
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="notify.waToken"]'
    title:
      sq: "Çelësi"
      en: "Token"
      uk: "Токен"
      ru: "Токен"
    caption:
      sq: "Mbetet i fshehur."
      en: "It stays hidden."
      uk: "Лишається прихованим."
      ru: "Остаётся скрытым."
  - key: 9
    anchor: notify.waPhone
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="notify.waPhone"]'
    title:
      sq: "Numri i biznesit"
      en: "Business number"
      uk: "Бізнес-номер"
      ru: "Бизнес-номер"
    caption:
      sq: "Numri nga i cili dërgohet."
      en: "The number it sends from."
      uk: "Номер, з якого надсилається."
      ru: "Номер, с которого отправляется."
  - key: 10
    anchor: notify.waTo
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="notify.waTo"]'
    title:
      sq: "Kujt"
      en: "To"
      uk: "Кому"
      ru: "Кому"
    caption:
      sq: "Numri që merr njoftimin."
      en: "The number that gets the notice."
      uk: "Номер, що отримує сповіщення."
      ru: "Номер, который получает уведомления."
  - key: 11
    anchor: more.tile.printer
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="more.tile.printer"]'
    title:
      sq: "Printeri"
      en: "Printer"
      uk: "Принтер"
      ru: "Принтер"
    caption:
      sq: "Fleta e kuzhinës për çdo porosi."
      en: "The kitchen ticket for every order."
      uk: "Кухонний чек для кожного замовлення."
      ru: "Кухонный чек для каждого заказа."
  - key: 12
    anchor: printer.state
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="printer.state"]'
    title:
      sq: "Gjendja"
      en: "State"
      uk: "Стан"
      ru: "Состояние"
    caption:
      sq: "Kur printoi për herë të fundit."
      en: "When it last printed."
      uk: "Коли друкував востаннє."
      ru: "Когда печатал в последний раз."
  - key: 13
    anchor: printer.name
    pending: no
    writes: no
    action:
      do: type
      selector: '[data-tour="printer.name"]'
      value: "Kitchen"
    title:
      sq: "Emri"
      en: "Name"
      uk: "Назва"
      ru: "Название"
    caption:
      sq: "P.sh. «kuzhina»."
      en: "For example “kitchen”."
      uk: "Наприклад, «кухня»."
      ru: "Например, «кухня»."
  - key: 14
    anchor: printer.url
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="printer.url"]'
    title:
      sq: "Adresa"
      en: "Address"
      uk: "Адреса"
      ru: "Адрес"
    caption:
      sq: "Ku dëgjon printeri."
      en: "Where the printer listens."
      uk: "Де слухає принтер."
      ru: "Где слушает принтер."
  - key: 15
    anchor: printer.key
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="printer.key"]'
    title:
      sq: "Çelësi"
      en: "Key"
      uk: "Ключ"
      ru: "Ключ"
    caption:
      sq: "Mbetet i fshehur."
      en: "It stays hidden."
      uk: "Лишається прихованим."
      ru: "Остаётся скрытым."
  - key: 16
    anchor: printer.save
    pending: no
    writes: yes
    action:
      do: click
      selector: '[data-tour="printer.save"]'
    title:
      sq: "Ruaj"
      en: "Save"
      uk: "Зберегти"
      ru: "Сохранить"
    caption:
      sq: "Porositë e reja printohen."
      en: "New orders print."
      uk: "Нові замовлення друкуються."
      ru: "Новые заказы печатаются."
  - key: 17
    anchor: printer.jobs
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="printer.jobs"]'
    title:
      sq: "Punët"
      en: "Jobs"
      uk: "Завдання"
      ru: "Задания"
    caption:
      sq: "Fletët e fundit dhe nëse dolën."
      en: "The latest tickets and whether they came out."
      uk: "Останні чеки й чи вони вийшли."
      ru: "Последние чеки и вышли ли они."
