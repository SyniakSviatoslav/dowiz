    anchor: ebills.mapped
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="ebills.mapped"]'
    title:
      sq: "Të çiftuara"
      en: "Mapped"
      uk: "Зіставлені"
      ru: "Сопоставленные"
    caption:
      sq: "Kodet që tashmë kanë pjatë."
      en: "Codes that already have a dish."
      uk: "Коди, які вже мають страву."
      ru: "Коды, у которых уже есть блюдо."
  - key: 11
    anchor: ebills.clear
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="ebills.clear"]'
    title:
      sq: "Hiq çiftin"
      en: "Clear the mapping"
      uk: "Прибрати зіставлення"
      ru: "Убрать сопоставление"
    caption:
      sq: "Kur keni zgjedhur gabim."
      en: "When you chose wrong."
      uk: "Коли ви помилилися."
      ru: "Когда вы ошиблись."
  - key: 12
    anchor: ebills.floor
