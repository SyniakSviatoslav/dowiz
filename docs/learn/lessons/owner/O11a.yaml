# Lesson O11a (owner). The ONE source for the in-app tour (/lib/learn.js, via
# tools/learn/build-lessons.mjs -> workers/api/public/learn/lessons.json) and for the recorder,
# which drives each step's `action` and burns its `title`/`caption` in as the subtitles.
# `pending: yes` = the anchor is named by the blueprint but not yet in the markup (tools/gates/learn.sh).
id: O11a
role: owner
module: ebills
order: 18
covers: [ebills]
title:
  sq: "Lexoni arkën fiskale"
  en: "Read the till"
  uk: "Читайте фіскальну касу"
  ru: "Читайте фискальную кассу"
goal:
  sq: "Lidhni arkën dhe çiftoni kodet e saj me pjatat."
  en: "Connect the till and map its codes to dishes."
  uk: "Підключити касу й зіставити її коди зі стравами."
  ru: "Подключить кассу и сопоставить её коды с блюдами."
steps:
  - key: 1
    anchor: more.tile.ebills
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="more.tile.ebills"]'
    title:
      sq: "eBills"
      en: "eBills"
      uk: "eBills"
      ru: "eBills"
    caption:
      sq: "Lidhja me arkën tuaj fiskale."
      en: "The link to your fiscal till."
      uk: "Зв’язок із вашою фіскальною касою."
      ru: "Связь с вашей фискальной кассой."
  - key: 2
    anchor: ebills.status
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="ebills.status"]'
    title:
      sq: "Gjendja"
      en: "Status"
      uk: "Стан"
      ru: "Состояние"
    caption:
      sq: "A lexohet arka dhe kur u lexua për herë të fundit."
      en: "Whether the till is being read, and when it last was."
      uk: "Чи читається каса і коли востаннє."
      ru: "Читается ли касса и когда в последний раз."
  - key: 3
    anchor: ebills.user
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="ebills.user"]'
    title:
      sq: "Përdoruesi"
      en: "User"
      uk: "Користувач"
      ru: "Пользователь"
