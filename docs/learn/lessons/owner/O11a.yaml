      sq: "Fjalëkalimi"
      en: "Password"
      uk: "Пароль"
      ru: "Пароль"
    caption:
      sq: "Shfaqet i fshehur dhe nuk del kurrë në video."
      en: "Shown masked, and never in a video."
      uk: "Показано прихованим і ніколи не потрапляє у відео."
      ru: "Показано скрытым и никогда не попадает в видео."
