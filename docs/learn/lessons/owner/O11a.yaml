    anchor: ebills.map
    pending: no
    writes: yes
    action:
      do: click
      selector: '[data-tour="ebills.map"]'
    title:
      sq: "Çifto"
      en: "Map"
      uk: "Зіставити"
      ru: "Сопоставить"
    caption:
      sq: "Tani shitjet e arkës zbresin stokun e kësaj pjate."
      en: "Now the till’s sales take this dish’s stock off."
      uk: "Тепер продажі з каси списують запаси цієї страви."
      ru: "Теперь продажи с кассы списывают запасы этого блюда."
