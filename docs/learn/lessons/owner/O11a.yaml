    anchor: ebills.pos
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="ebills.pos"]'
    title:
      sq: "Arka nr."
      en: "Till no."
      uk: "Каса №"
      ru: "Касса №"
    caption:
      sq: "Nëse keni më shumë se një arkë."
      en: "If you have more than one till."
      uk: "Якщо у вас більше однієї каси."
      ru: "Если у вас больше одной кассы."
  - key: 6
    anchor: ebills.save
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="ebills.save"]'
    title:
      sq: "Ruaj"
      en: "Save"
      uk: "Зберегти"
      ru: "Сохранить"
