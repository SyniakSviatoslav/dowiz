# Lesson O30 (owner). The ONE source for the in-app tour (/lib/learn.js, via
# tools/learn/build-lessons.mjs -> workers/api/public/learn/lessons.json) and for the recorder,
# which drives each step's `action` and burns its `title`/`caption` in as the subtitles.
# `pending: yes` = the anchor is named by the blueprint but not yet in the markup (tools/gates/learn.sh).
# W-QR: the bag insert (admin/bag.js). Steps WAIT: a recording must not change the venue's offer.
id: O30
role: owner
module: bagQr
order: 51
covers: [bagQr]
title:
  sq: "Klientet e Wolt, direkt te ju"
  en: "Wolt guests, direct to you"
  uk: "Гості з Wolt - напряму до вас"
  ru: "Гости из Wolt - напрямую к вам"
goal:
  sq: "Nje kod QR ne qeset e dergesave: porosia e dyte vjen pa komision."
  en: "A QR card in delivery bags: the second order comes without commission."
  uk: "QR-картка в пакетах доставки: друге замовлення приходить без комісії."
  ru: "QR-карточка в пакетах доставки: второй заказ приходит без комиссии."
