    title:
      sq: "Menuja"
      en: "Menu"
      uk: "Меню"
      ru: "Меню"
    caption:
      sq: "Pjatat e lokalit."
      en: "The venueʼs dishes."
      uk: "Страви закладу."
      ru: "Блюда заведения."
