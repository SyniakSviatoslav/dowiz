id: O20
role: owner
module: kitchen
order: 38
covers: [kitchen]
title:
  sq: "Kuzhina: biletat"
  en: "The kitchen board"
  uk: "Кухня: чеки"
  ru: "Кухня: чеки"
goal:
  sq: "Shihni, pranoni dhe çoni gati një porosi; hiqni një pjatë nga shitja."
  en: "See, accept and finish an order; take a dish off sale."
  uk: "Побачити, прийняти й віддати замовлення; зняти страву з продажу."
  ru: "Увидеть, принять и отдать заказ; снять блюдо с продажи."
steps:
  - key: 1
    anchor: nav.kitchen
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="nav.kitchen"]'
    title:
      sq: "Kuzhina"
      en: "Kitchen"
      uk: "Кухня"
      ru: "Кухня"
    caption:
      sq: "Skeda e kuzhinës, në çdo telefon ose tablet."
      en: "The kitchen tab, on any phone or tablet."
      uk: "Вкладка кухні, на будь-якому телефоні чи планшеті."
      ru: "Вкладка кухни, на любом телефоне или планшете."
