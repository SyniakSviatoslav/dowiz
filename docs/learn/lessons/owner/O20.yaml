    pending: no
    writes: no
    action:
      do: type
      selector: '[data-tour="kitchen.reason"]'
      value: "Out of salmon"
    title:
      sq: "Arsyeja"
      en: "Reason"
      uk: "Причина"
      ru: "Причина"
    caption:
      sq: "Klienti e lexon arsyen."
      en: "The customer reads the reason."
      uk: "Клієнт читає причину."
      ru: "Клиент читает причину."
