    anchor: kitchen.board
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="kitchen.board"]'
    title:
      sq: "Tri kolona"
      en: "Three columns"
      uk: "Три колонки"
      ru: "Три колонки"
    caption:
      sq: "Të reja, në përgatitje, gati. Më e vjetra majtas."
      en: "New, preparing, ready. The oldest first."
      uk: "Нові, готуються, готові. Найстаріші першими."
      ru: "Новые, готовятся, готовые. Самые старые первыми."
