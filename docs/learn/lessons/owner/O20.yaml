    anchor: kitchen.station
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="kitchen.station"]'
    title:
      sq: "Stacioni"
      en: "Station"
      uk: "Станція"
      ru: "Станция"
    caption:
      sq: "Sushi, kuzhina ose bar: shihni vetëm pjatat tuaja."
      en: "Sushi, kitchen or bar: see only your dishes."
      uk: "Суші, кухня чи бар: бачите лише свої страви."
      ru: "Суши, кухня или бар: видите только свои блюда."
