# Lesson O4c (owner). The ONE source for the in-app tour (/lib/learn.js, via
# tools/learn/build-lessons.mjs -> workers/api/public/learn/lessons.json) and for the recorder,
# which drives each step's `action` and burns its `title`/`caption` in as the subtitles.
# `pending: yes` = the anchor is named by the blueprint but not yet in the markup (tools/gates/learn.sh).
id: O4c
role: owner
module: menu
order: 9
covers: []
title:
  sq: "Receta, shija, struktura dhe aroma e një pjate"
  en: "A dish’s recipe, taste, texture and aroma"
  uk: "Рецепт, смак, текстура й аромат страви"
  ru: "Рецепт, вкус, текстура и аромат блюда"
goal:
  sq: "Lidhni një recetë dhe përshkruani shijen (gjashtë boshte), strukturën dhe aromën."
  en: "Attach a recipe and describe the taste (six axes), the texture and the aroma."
  uk: "Прив’язати рецепт і описати смак (шість осей), текстуру й аромат."
  ru: "Привязать рецепт и описать вкус (шесть осей), текстуру и аромат."
steps:
  - key: 1
    anchor: recipe.kind
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="recipe.kind"]'
    title:
      sq: "Lloji"
      en: "The kind"
      uk: "Тип"
      ru: "Тип"
    caption:
      sq: "Pjatë me recetë, apo artikull i gatshëm si një pije."
      en: "A dish with a recipe, or a ready item such as a drink."
      uk: "Страва з рецептом чи готовий товар, як-от напій."
      ru: "Блюдо с рецептом или готовый товар, например напиток."
  - key: 2
    anchor: recipe.pick
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="recipe.pick"]'
    title:
      sq: "Furnizimi"
      en: "A supply"
      uk: "Запас"
      ru: "Запас"
    caption:
      sq: "Zgjidhni nga furnizimet tuaja."
      en: "Pick from your supplies."
      uk: "Оберіть зі своїх запасів."
      ru: "Выберите из своих запасов."
  - key: 3
    anchor: recipe.addLine
    pending: no
    writes: yes
    action:
      do: click
      selector: '[data-tour="recipe.addLine"]'
    title:
      sq: "Shto rresht"
      en: "Add a line"
      uk: "Додати рядок"
      ru: "Добавить строку"
    caption:
      sq: "Një rresht për çdo përbërës."
      en: "One line per ingredient."
      uk: "Один рядок на інгредієнт."
      ru: "Одна строка на ингредиент."
  - key: 4
    anchor: recipe.qty
    pending: no
    writes: no
    action:
      do: type
      selector: '[data-tour="recipe.qty"]'
      value: "120"
    title:
      sq: "Sasia"
      en: "The quantity"
      uk: "Кількість"
      ru: "Количество"
    caption:
      sq: "Në njësinë e furnizimit. Kaloritë, pesha dhe kostoja llogariten nga kjo."
      en: "In the supply’s unit. Calories, weight and cost are worked out from it."
      uk: "В одиницях запасу. З цього рахуються калорії, вага й собівартість."
      ru: "В единицах запаса. Из этого считаются калории, вес и себестоимость."
  - key: 5
    anchor: recipe.more
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="recipe.more"]'
    title:
      sq: "Më shumë"
      en: "More"
      uk: "Більше"
      ru: "Ещё"
    caption:
      sq: "Rrit sasinë me një hap."
      en: "Raises the quantity by one step."
      uk: "Збільшує кількість на крок."
      ru: "Увеличивает количество на шаг."
  - key: 6
    anchor: recipe.less
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="recipe.less"]'
    title:
      sq: "Më pak"
      en: "Less"
      uk: "Менше"
      ru: "Меньше"
    caption:
      sq: "E ul me një hap."
      en: "Lowers it by one step."
      uk: "Зменшує на крок."
      ru: "Уменьшает на шаг."
  - key: 7
    anchor: recipe.removeLine
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="recipe.removeLine"]'
    title:
      sq: "Hiq rreshtin"
      en: "Remove the line"
      uk: "Прибрати рядок"
      ru: "Убрать строку"
    caption:
      sq: "Kur një përbërës nuk hyn më."
      en: "When an ingredient no longer goes in."
      uk: "Коли інгредієнт більше не входить."
      ru: "Когда ингредиент больше не входит."
  - key: 8
    anchor: sense.suggest
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="sense.suggest"]'
    title:
      sq: "Sugjero"
      en: "Suggest"
      uk: "Підказати"
      ru: "Подсказать"
    caption:
      sq: "Një draft nga përshkrimi dhe pjatat e zakonshme të sushit. Asgjë nuk ruhet pa shtypur Ruaj."
      en: "A draft from the description and the usual sushi dishes. Nothing is saved until you press Save."
      uk: "Чернетка з опису та типових страв суші. Нічого не зберігається, доки не натиснете «Зберегти»."
      ru: "Черновик из описания и типичных блюд суши. Ничего не сохраняется, пока не нажмёте «Сохранить»."
  - key: 9
    anchor: sense.taste
    pending: no
    writes: yes
    action:
      do: click
      selector: '[data-tour="sense.taste"]'
    title:
      sq: "Shija"
      en: "Taste"
      uk: "Смак"
      ru: "Вкус"
    caption:
      sq: "Gjashtë boshte nga 0 në 5: i ëmbël, i thartë, i kripur, i hidhur, umami, djegës. Prekni sërish për ta hequr."
      en: "Six axes from 0 to 5: sweet, sour, salty, bitter, umami, spicy. Tap again to clear."
      uk: "Шість осей від 0 до 5: солодкий, кислий, солоний, гіркий, умамі, гострий. Торкніться ще раз, щоб зняти."
      ru: "Шесть осей от 0 до 5: сладкий, кислый, солёный, горький, умами, острый. Нажмите ещё раз, чтобы снять."
  - key: 10
    anchor: sense.texture
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="sense.texture"]'
    title:
      sq: "Struktura"
      en: "Texture"
      uk: "Текстура"
      ru: "Текстура"
    caption:
      sq: "Krokant, kremoz, i butë e të tjera, 1 deri 3. Klientët filtrojnë sipas tyre."
      en: "Crispy, creamy, tender and more, 1 to 3. Guests filter by them."
      uk: "Хрусткий, кремовий, ніжний тощо, від 1 до 3. Гості фільтрують за ними."
      ru: "Хрустящий, кремовый, нежный и другие, от 1 до 3. Гости фильтруют по ним."
  - key: 11
    anchor: sense.aroma
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="sense.aroma"]'
    title:
      sq: "Aroma"
      en: "Aroma"
      uk: "Аромат"
      ru: "Аромат"
    caption:
      sq: "I tymosur, agrume, barishte e të tjera. Çfarë nuk prekni nuk shfaqet."
      en: "Smoky, citrus, herbal and more. What you leave untouched is not shown."
      uk: "Копчений, цитрусовий, трав’яний тощо. Чого не торкалися, не показується."
      ru: "Копчёный, цитрусовый, травяной и другие. Что не трогали, не показывается."
  - key: 12
    anchor: sense.recipe
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="sense.recipe"]'
    title:
      sq: "Nga receta"
      en: "From the recipe"
      uk: "З рецепта"
      ru: "Из рецепта"
    caption:
      sq: "Kur pjatat kanë receta, shija sugjerohet edhe nga përbërësit e përbashkët. Kontrollojeni dhe ruajeni."
      en: "Once dishes have recipes, the taste is also suggested from the supplies they share. Check it, then save."
      uk: "Коли страви мають рецепти, смак підказується й зі спільних продуктів. Перевірте й збережіть."
      ru: "Когда у блюд есть рецепты, вкус подсказывается и по общим продуктам. Проверьте и сохраните."
