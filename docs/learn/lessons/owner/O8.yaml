# Lesson O8 (owner). The ONE source for the in-app tour (/lib/learn.js, via
# tools/learn/build-lessons.mjs -> workers/api/public/learn/lessons.json) and for the recorder,
# which drives each step's `action` and burns its `title`/`caption` in as the subtitles.
# `pending: yes` = the anchor is named by the blueprint but not yet in the markup (tools/gates/learn.sh).
id: O8
role: owner
module: bookings
order: 15
covers: [bookings]
title:
  sq: "Rezervimet"
  en: "Reservations"
  uk: "Бронювання"
  ru: "Бронирование"
goal:
  sq: "Merrni një rezervim me telefon dhe konfirmoni një nga uebi."
  en: "Take a booking by phone and confirm one from the web."
  uk: "Прийняти бронювання телефоном і підтвердити одне з сайту."
  ru: "Принять бронирование по телефону и подтвердить одно с сайта."
steps:
  - key: 1
    anchor: more.tile.bookings
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="more.tile.bookings"]'
    title:
      sq: "Rezervimet"
      en: "Bookings"
      uk: "Бронювання"
      ru: "Бронирование"
    caption:
      sq: "Nga «Më shumë»."
      en: "From “More”."
      uk: "З розділу «Більше»."
      ru: "Из раздела «Ещё»."
  - key: 2
    anchor: bookings.day
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="bookings.day"]'
    title:
      sq: "Dita"
      en: "The day"
      uk: "День"
      ru: "День"
    caption:
      sq: "Zgjidhni ditën."
      en: "Choose the day."
      uk: "Оберіть день."
      ru: "Выберите день."
  - key: 3
    anchor: bookings.list
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="bookings.list"]'
    title:
      sq: "Lista"
      en: "The list"
      uk: "Список"
      ru: "Список"
    caption:
      sq: "Rezervimet e ditës sipas orës."
      en: "The day’s bookings by time."
      uk: "Бронювання дня за часом."
      ru: "Бронирования дня по времени."
  - key: 4
    anchor: bookings.row
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="bookings.row"]'
    title:
      sq: "Një rezervim"
      en: "A booking"
      uk: "Бронювання"
      ru: "Бронирование"
    caption:
      sq: "Ora, emri, sa veta, tavolina dhe gjendja."
      en: "The time, name, party, table and status."
      uk: "Час, ім’я, кількість гостей, стіл і статус."
      ru: "Время, имя, число гостей, стол и статус."
  - key: 5
    anchor: bookings.confirm
    pending: no
    writes: yes
    action:
      do: click
      selector: '[data-tour="bookings.confirm"]'
    title:
      sq: "Konfirmo"
      en: "Confirm"
      uk: "Підтвердити"
      ru: "Подтвердить"
    caption:
      sq: "Klienti merr konfirmimin."
      en: "The customer gets the confirmation."
      uk: "Клієнт отримує підтвердження."
      ru: "Клиент получает подтверждение."
  - key: 6
    anchor: bookings.decline
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="bookings.decline"]'
    title:
      sq: "Refuzo"
      en: "Decline"
      uk: "Відхилити"
      ru: "Отклонить"
    caption:
      sq: "Kur s’ka vend."
      en: "When there is no room."
      uk: "Коли немає місць."
      ru: "Когда нет мест."
  - key: 7
    anchor: bookings.new
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="bookings.new"]'
    title:
      sq: "Rezervim me telefon"
      en: "Booking by phone"
      uk: "Бронювання телефоном"
      ru: "Бронирование по телефону"
    caption:
      sq: "Kur klienti telefonon, shkruajeni këtu që salla ta dijë."
      en: "When a customer calls, write it here so the room knows."
      uk: "Коли клієнт телефонує, запишіть тут, щоб зал знав."
      ru: "Когда клиент звонит, запишите здесь, чтобы зал знал."
  - key: 8
    anchor: bookings.name
    pending: no
    writes: no
    action:
      do: type
      selector: '[data-tour="bookings.name"]'
      value: "Ana"
    title:
      sq: "Emri"
      en: "Name"
      uk: "Ім’я"
      ru: "Имя"
    caption:
      sq: "Me cilin emër."
      en: "Under which name."
      uk: "На яке ім’я."
      ru: "На какое имя."
  - key: 9
    anchor: bookings.phone
    pending: no
    writes: no
    action:
      do: type
      selector: '[data-tour="bookings.phone"]'
      value: "+355 69 000 0000"
    title:
      sq: "Telefoni"
      en: "Phone"
      uk: "Телефон"
      ru: "Телефон"
    caption:
      sq: "Për ta njoftuar."
      en: "To reach them."
      uk: "Щоб зв’язатися."
      ru: "Чтобы связаться."
  - key: 10
    anchor: bookings.party
    pending: no
    writes: no
    action:
      do: type
      selector: '[data-tour="bookings.party"]'
      value: "4"
    title:
      sq: "Sa veta"
      en: "Party size"
      uk: "Скільки гостей"
      ru: "Сколько гостей"
    caption:
      sq: "Numri i personave."
      en: "The number of people."
      uk: "Кількість людей."
      ru: "Число людей."
  - key: 11
    anchor: bookings.time
    pending: no
    writes: no
    action:
      do: type
      selector: '[data-tour="bookings.time"]'
      value: "20:00"
    title:
      sq: "Ora"
      en: "The time"
      uk: "Час"
      ru: "Время"
    caption:
      sq: "Ora e mbërritjes."
      en: "The arrival time."
      uk: "Час прибуття."
      ru: "Время прибытия."
  - key: 12
    anchor: bookings.table
    pending: no
    writes: no
    action:
      do: type
      selector: '[data-tour="bookings.table"]'
      value: "7"
    title:
      sq: "Tavolina"
      en: "The table"
      uk: "Стіл"
      ru: "Стол"
    caption:
      sq: "Nëse e dini tashmë."
      en: "If you already know it."
      uk: "Якщо вже знаєте."
      ru: "Если уже знаете."
  - key: 13
    anchor: bookings.book
    pending: no
    writes: yes
    action:
      do: click
      selector: '[data-tour="bookings.book"]'
    title:
      sq: "Rezervo"
      en: "Book"
      uk: "Забронювати"
      ru: "Забронировать"
    caption:
      sq: "Kamarieri e sheh tavolinën si të rezervuar."
      en: "The waiter sees the table as booked."
      uk: "Офіціант бачить стіл заброньованим."
      ru: "Официант видит стол забронированным."
