# Lesson G1 (guest). The ONE source for the in-app tour (/lib/learn.js, via
# tools/learn/build-lessons.mjs -> workers/api/public/learn/lessons.json) and for the recorder,
# which drives each step's `action` and burns its `title`/`caption` in as the subtitles.
# `pending: yes` = the anchor is named by the blueprint but not yet in the markup (tools/gates/learn.sh).
id: G1
role: guest
module: menu
order: 1
covers: []
title:
  sq: "Gjeni pjatën tuaj"
  en: "Find your dish"
  uk: "Знайдіть свою страву"
  ru: "Найдите своё блюдо"
goal:
  sq: "Kërkoni, filtroni dhe renditni menunë në gjuhën dhe monedhën tuaj."
  en: "Search, filter and sort the menu in your own language and currency."
  uk: "Шукати, фільтрувати й сортувати меню своєю мовою та у своїй валюті."
  ru: "Искать, фильтровать и сортировать меню на своём языке и в своей валюте."
steps:
  - key: 1
    anchor: nav.menu
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="nav.menu"]'
    title:
      sq: "Menuja"
      en: "Menu"
      uk: "Меню"
      ru: "Меню"
    caption:
      sq: "Skeda e parë: gjithë menuja e lokalit."
      en: "The first tab: the venue’s whole menu."
      uk: "Перша вкладка: усе меню закладу."
      ru: "Первая вкладка: всё меню заведения."
  - key: 2
    anchor: nav.info
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="nav.info"]'
    title:
      sq: "Rreth lokalit"
      en: "About the venue"
      uk: "Про заклад"
      ru: "О заведении"
    caption:
      sq: "Adresa, orari dhe telefoni."
      en: "Address, hours and phone."
      uk: "Адреса, години роботи й телефон."
      ru: "Адрес, часы работы и телефон."
  - key: 3
    anchor: top.lang
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="top.lang"]'
    title:
      sq: "Gjuha"
      en: "Language"
      uk: "Мова"
      ru: "Язык"
    caption:
      sq: "Shqip, anglisht, ukrainisht ose rusisht."
      en: "Albanian, English, Ukrainian or Russian."
      uk: "Албанська, англійська, українська чи російська."
      ru: "Албанский, английский, украинский или русский."
  - key: 4
    anchor: lang.choice
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="lang.choice"]'
    title:
      sq: "Zgjidhni gjuhën"
      en: "Choose the language"
      uk: "Оберіть мову"
      ru: "Выберите язык"
    caption:
      sq: "Menuja dhe butonat ndryshojnë menjëherë."
      en: "The menu and the buttons change at once."
      uk: "Меню й кнопки змінюються одразу."
      ru: "Меню и кнопки меняются сразу."
  - key: 5
    anchor: top.currency
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="top.currency"]'
    title:
      sq: "Monedha"
      en: "Currency"
      uk: "Валюта"
      ru: "Валюта"
    caption:
      sq: "Çmimet shfaqen edhe në monedhën tuaj; paguani në monedhën e lokalit."
      en: "Prices are also shown in your currency; you pay in the venue’s."
      uk: "Ціни показано й у вашій валюті; платите ви у валюті закладу."
      ru: "Цены показаны и в вашей валюте; платите вы в валюте заведения."
  - key: 6
    anchor: currency.choice
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="currency.choice"]'
    title:
      sq: "Zgjidhni monedhën"
      en: "Choose the currency"
      uk: "Оберіть валюту"
      ru: "Выберите валюту"
    caption:
      sq: "Një prekje, dhe të gjitha çmimet rillogariten."
      en: "One tap, and every price is recalculated."
      uk: "Один дотик — і всі ціни перераховано."
      ru: "Одно касание — и все цены пересчитаны."
  - key: 7
    anchor: nav.search
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="nav.search"]'
    title:
      sq: "Kërkimi"
      en: "Search"
      uk: "Пошук"
      ru: "Поиск"
    caption:
      sq: "Skeda e kërkimit."
      en: "The search tab."
      uk: "Вкладка пошуку."
      ru: "Вкладка поиска."
  - key: 8
    anchor: menu.search
    pending: no
    writes: no
    action:
      do: type
      selector: '[data-tour="menu.search"]'
      value: "salmon"
    title:
      sq: "Kërkoni"
      en: "Search"
      uk: "Пошук"
      ru: "Поиск"
    caption:
      sq: "Shkruani emrin ose një përbërës."
      en: "Type a name or an ingredient."
      uk: "Введіть назву або інгредієнт."
      ru: "Введите название или ингредиент."
  - key: 9
    anchor: menu.voice
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="menu.voice"]'
    title:
      sq: "Me zë"
      en: "By voice"
      uk: "Голосом"
      ru: "Голосом"
    caption:
      sq: "Thoni çfarë kërkoni në vend që ta shkruani."
      en: "Say what you are looking for instead of typing it."
      uk: "Скажіть, що шукаєте, замість того щоб писати."
      ru: "Скажите, что ищете, вместо того чтобы писать."
  - key: 10
    anchor: voice.add
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="voice.add"]'
    title:
      sq: "Shtoje"
      en: "Add it"
      uk: "Додати"
      ru: "Добавить"
    caption:
      sq: "Nëse dëgjoi mirë, shtojeni në shportë."
      en: "If it heard right, add it to the basket."
      uk: "Якщо почуто правильно, додайте в кошик."
      ru: "Если услышано правильно, добавьте в корзину."
  - key: 11
    anchor: voice.again
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="voice.again"]'
    title:
      sq: "Jo ky"
      en: "Not this"
      uk: "Не це"
      ru: "Не то"
    caption:
      sq: "Provoni sërish me zë."
      en: "Try again by voice."
      uk: "Спробуйте ще раз голосом."
      ru: "Попробуйте ещё раз голосом."
  - key: 12
    anchor: menu.category
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="menu.category"]'
    title:
      sq: "Kategoritë"
      en: "Categories"
      uk: "Категорії"
      ru: "Категории"
    caption:
      sq: "Kaloni direkt te sushi, supat ose pijet."
      en: "Jump straight to sushi, soups or drinks."
      uk: "Переходьте одразу до суші, супів чи напоїв."
      ru: "Переходите сразу к суши, супам или напиткам."
  - key: 13
    anchor: menu.filter
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="menu.filter"]'
    title:
      sq: "Filtri"
      en: "Filter"
      uk: "Фільтр"
      ru: "Фильтр"
    caption:
      sq: "Pa alergjenët që nuk i hani, ose sipas shijes."
      en: "Without the allergens you avoid, or by taste."
      uk: "Без алергенів, яких ви уникаєте, або за смаком."
      ru: "Без аллергенов, которых вы избегаете, или по вкусу."
  - key: 14
    anchor: menu.sort
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="menu.sort"]'
    title:
      sq: "Renditja"
      en: "Sort"
      uk: "Сортування"
      ru: "Сортировка"
    caption:
      sq: "Sipas çmimit, kalorive ose si i vendosi lokali."
      en: "By price, calories or the venue’s own order."
      uk: "За ціною, калоріями або в порядку закладу."
      ru: "По цене, калориям или в порядке заведения."
  - key: 15
    anchor: menu.sortChoice
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="menu.sortChoice"]'
    title:
      sq: "Zgjidhni renditjen"
      en: "Choose the order"
      uk: "Оберіть порядок"
      ru: "Выберите порядок"
    caption:
      sq: "Menuja rirenditet menjëherë."
      en: "The menu reorders at once."
      uk: "Меню одразу перевпорядковується."
      ru: "Меню сразу перестраивается."
