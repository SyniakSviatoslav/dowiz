# Lesson C5 (courier). The ONE source for the in-app tour (/lib/learn.js, via
# tools/learn/build-lessons.mjs -> workers/api/public/learn/lessons.json) and for the recorder,
# which drives each step's `action` and burns its `title`/`caption` in as the subtitles.
# `pending: yes` = the anchor is named by the blueprint but not yet in the markup (tools/gates/learn.sh).
id: C5
role: courier
module: offline
order: 5
covers: []
title:
  sq: "Pa sinjal"
  en: "No signal"
  uk: "Без зв’язку"
goal:
  sq: "Dini çfarë ruhet në telefon, çfarë dërgohet më vonë dhe çfarë refuzohet."
  en: "Know what the phone keeps, what is sent later and what is refused."
  uk: "Знати, що телефон зберігає, що надішле пізніше і що буде відхилено."
steps:
  - key: 1
    anchor: hud.outbox
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="hud.outbox"]'
    title:
      sq: "Të padërguara"
      en: "Unsent"
      uk: "Не надіслано"
    caption:
      sq: "Pa rrjet, prekjet tuaja ruhen në telefon. Kjo etiketë tregon sa janë ende pa dërguar dhe zhduket vetë kur dërgohen."
      en: "With no network, your taps are kept on the phone. This tag shows how many are still unsent, and it goes away by itself once they land."
      uk: "Без мережі ваші дотики зберігаються в телефоні. Ця позначка показує, скільки ще не надіслано, і зникає сама, щойно вони дійдуть."
  - key: 2
    anchor: hud.sheet
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="hud.sheet"]'
    title:
      sq: "Do ta dërgojmë"
      en: "Will be sent"
      uk: "Буде надіслано"
    caption:
      sq: "Një veprim në pritje zëvendëson butonin: shihni «Do ta dërgojmë», jo një buton për ta shtypur sërish."
      en: "A waiting action replaces the button: you see “Will be sent”, not a button to press again."
      uk: "Дія в черзі замінює кнопку: ви бачите «Буде надіслано», а не кнопку, яку треба натиснути знову."
  - key: 3
    anchor: hud.shift
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="hud.shift"]'
    title:
      sq: "Të dhëna të vjetra"
      en: "Old data"
      uk: "Застарілі дані"
    caption:
      sq: "Pa lidhje, ekrani tregon përgjigjen e fundit të lokalit me orën e saj. Nëse porosia ndryshoi ndërkohë, veprimi juaj refuzohet dhe ju tregohet pse."
      en: "Offline, the screen shows the venue’s last answer with its time. If the order changed meanwhile, your action is refused and you are told why."
      uk: "Без зв’язку екран показує останню відповідь закладу з її часом. Якщо замовлення тим часом змінилося, вашу дію відхилять і скажуть чому."
  - key: 4
    anchor: hud.gps
    pending: no
    writes: no
    action:
      do: wait
      selector: '[data-tour="hud.gps"]'
    title:
      sq: "GPS"
      en: "GPS"
      uk: "GPS"
    caption:
      sq: "Kjo etiketë tregon nëse telefoni e di ku jeni. Pa GPS, koha deri te dera nuk rifreskohet."
      en: "This tag shows whether the phone knows where you are. Without GPS the time to the door does not update."
      uk: "Ця позначка показує, чи знає телефон, де ви. Без GPS час до дверей не оновлюється."
