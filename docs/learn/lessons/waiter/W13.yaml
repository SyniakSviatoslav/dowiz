# Lesson W13 (waiter). The ONE source for the in-app tour (/lib/learn.js, via
# tools/learn/build-lessons.mjs -> workers/api/public/learn/lessons.json) and for the recorder,
# which drives each step's `action` and burns its `title`/`caption` in as the subtitles.
# W-WIRE row 10 (2026-09-26): the person at the door checks a guest's booking pass.
id: W13
role: waiter
module: pass
order: 13
covers: [pass]
title:
  sq: "Kontrolli i biletës"
  en: "Checking a pass"
  uk: "Перевірка перепустки"
  ru: "Проверка пропуска"
goal:
  sq: "Kontrolloni biletën e rezervimit të një mysafiri te dera."
  en: "Check a guest's booking pass at the door."
  uk: "Перевірити перепустку бронювання гостя біля дверей."
  ru: "Проверить пропуск бронирования гостя у двери."
steps:
  - key: 1
    anchor: room.pass
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="room.pass"]'
    title:
      sq: "Biletat"
      en: "Passes"
      uk: "Перепустки"
      ru: "Пропуски"
    caption:
      sq: "Mysafiri tregon biletën që mori me rezervimin."
      en: "The guest shows the pass they got with their booking."
      uk: "Гість показує перепустку, отриману з бронюванням."
      ru: "Гость показывает пропуск, полученный с бронированием."
  - key: 2
    anchor: pass.code
    pending: no
    writes: no
    action:
      do: type
      selector: '[data-tour="pass.code"]'
      value: "PASS-CODE"
    title:
      sq: "Kodi"
      en: "The code"
      uk: "Код"
      ru: "Код"
    caption:
      sq: "Shkruani kodin nga bileta, ose ngjisni atë që lexoi skaneri."
      en: "Type the code from the pass, or paste what a scanner read."
      uk: "Введіть код із перепустки або вставте те, що прочитав сканер."
      ru: "Введите код с пропуска или вставьте то, что прочитал сканер."
  - key: 3
    anchor: pass.check
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="pass.check"]'
    title:
      sq: "Kontrolloni"
      en: "Check"
      uk: "Перевірте"
      ru: "Проверьте"
    caption:
      sq: "Hub-i thotë nëse bileta është e vlefshme, për sa persona dhe për cilën orë."
      en: "The hub says whether the pass is valid, for how many people and for what time."
      uk: "Хаб каже, чи дійсна перепустка, на скільки осіб і на котру годину."
      ru: "Хаб говорит, действителен ли пропуск, на сколько человек и на какое время."
  - key: 4
    anchor: nav.back
    pending: no
    writes: no
    action:
      do: click
      selector: '[data-tour="nav.back"]'
    title:
      sq: "Prapa"
      en: "Back"
      uk: "Назад"
      ru: "Назад"
    caption:
      sq: "Kthehuni te salla."
      en: "Go back to the room."
      uk: "Поверніться до залу."
      ru: "Вернитесь в зал."
