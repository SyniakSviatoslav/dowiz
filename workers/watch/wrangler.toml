# dowiz-watch: an independent monitor that lives inside Cloudflare (W-LIVE, 2026-10-03).
#
# WHY IT EXISTS. Bot Fight Mode on dowiz.org stays ON (operator, 2026-10-03: "найкраще обходити, щоб
# реальний захист лишався"). It answers every request from GitHub's runners (ASN 8075) with a managed
# challenge (measured with firewallEventsAdaptive), so no GitHub-hosted probe can see production.
# This Worker probes production from inside Cloudflare every 5 minutes. GitHub then watches THIS
# Worker on its workers.dev URL, which is outside the dowiz.org zone, so Bot Fight Mode does not
# apply to it.
#
# INDEPENDENT ON PURPOSE: no code shared with workers/api, no binding to it, its own cron, its own
# Durable Object. If dowiz-api is broken, this still runs and says so.
#
# PLAIN JS, NO BUILD STEP. A Rust Worker needs worker-build, a wasm toolchain and a cargo slot on
# the box; this is ~300 lines of fetch-and-compare with no dependency, and `wrangler deploy` uploads
# it as it stands. Nothing in it is money, order state or crypto, which is what the repo keeps in Rust.
#
# DEPLOY (main only; account id comes from the token file, never committed):
#   cd workers/watch && . /root/.cf_deploy_token && npx wrangler@4 deploy \
#     --var WATCH_COMMIT:$(git -C /root/dowiz rev-parse --short HEAD)
# RED TEST (one deploy, then the plain deploy again to undo it):
#   ... npx wrangler@4 deploy --var WATCH_COMMIT:<sha> --var EXTRA_TARGETS:"qa-404=https://qa-durres.dowiz.org/healthz-404"
name = "dowiz-watch"
main = "src/index.js"
compatibility_date = "2026-09-15"
# The workers.dev URL is how GitHub reaches it (outside the dowiz.org zone, so no Bot Fight Mode).
workers_dev = true

[vars]
WATCH_VERSION = "0.1.0"
# Set at deploy with --var WATCH_COMMIT:<sha>; "unset" here means somebody deployed without it.
WATCH_COMMIT = "unset"
WATCH_DOMAIN = "dowiz.org"
WATCH_VENUES = "sushi-durres dubin-sushi qa-durres"
# Extra "name=url" pairs probed as /healthz-style targets. Empty in production; the RED test sets it.
EXTRA_TARGETS = ""
# The watcher's own public URL, quoted in alert mails. Set at deploy once workers.dev names it:
# (account workers.dev subdomain MEASURED 2026-10-03 via GET /accounts/<a>/workers/subdomain)
WATCH_URL = "https://dowiz-watch.sviatoslavsyniak.workers.dev"
MAIL_FROM = "watch@dowiz.org"
MAIL_TO = "syniaksviatoslav@proton.me"

# The SAME destination the waitlist already mails. It is verified in Email Routing (memory
# dowiz-waitlist-mail-needs-email-routing). A binding to an unverified address fails the deploy,
# so do not add another address here without checking GET /accounts/<a>/email/routing/addresses.
[[send_email]]
name = "ALERT_MAIL"
destination_address = "syniaksviatoslav@proton.me"

# The last result per target, the last tick, and the last mail's result. One SQLite-backed Durable
# Object (available on the Free plan). Writes: one row per tick (288/day) plus one per changed
# target and per mail sent, against the Free plan's 100,000 rows written per day.
[[durable_objects.bindings]]
name = "STATE"
class_name = "WatchState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WatchState"]

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
