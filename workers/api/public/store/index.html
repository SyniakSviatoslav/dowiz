<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- The browser chrome must be a colour the page actually contains. This was
     #C1121F, a red left over from an older palette that appears nowhere in the
     token set -- so a phone's status bar sat in a colour the design system does
     not know about. These are --brand-bg in each theme; a <meta> cannot read a
     CSS variable, so the values are repeated here and the design gate checks
     that they still match. -->
<meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<!-- ONE VENUE'S NAME WAS BAKED INTO EVERY VENUE'S PAGE. This document is now
     served for every client hub, so a hardcoded title showed "Dubin & Sushi" in
     the tab of a different restaurant until the menu fetch returned and the
     script replaced it. The real name arrives with the catalogue and is set
     there; what belongs here is the platform, which is true before any fetch. -->
<title>dowiz</title>
<!-- NO WEB FONTS, AND THAT IS A DESIGN DECISION RATHER THAN A SAVING.
     
     These surfaces loaded two hundred kilobytes of render-blocking typeface
     from Google before anything could paint, and every customer's IP reached
     Google to do it -- on a service whose first invariant is local-first. The
     Cyrillic the console is written in needed a further subset again.
     
     What is lost is small: at fourteen to thirty-three pixels, on a phone, the
     difference between DM Sans and the system face is not what anyone notices.
     What Swiss typography actually asks for is the grid, the measure, the one
     ratio and the restraint -- Müller-Brockmann worked in Akzidenz-Grotesk
     because it was the face that was already there. The system stack is ours.
     
     It also renders instantly with no swap: no flash of fallback text, no
     layout shift when the real face arrives, nothing to wait for. -->

<link rel="stylesheet" href="/lib/icons.css">
<link rel="stylesheet" href="/lib/tokens.css">
<link rel="stylesheet" href="/lib/components.css">
<style>
/* ── dowiz storefront ──────────────────────────────────────────────────────────
   Built on the project's OWN scales (docs/design/DESIGN.md §1-§4 and
   packages/ui/src/theme/tokens.css), not on values invented here.

   The storefront-polish CONSISTENCY-AUDIT found the real failure mode on the old
   codebase: "the design system is good; adoption is partial" -- 103 stock type
   classes fighting 113 modular ones, five different primary-CTA signatures, two
   radius families holding the same pixels under different names, and no global
   heading rule, so the SAME dish name rendered in two fonts on two screens.
   This file answers each of those by construction: one type scale, one spacing
   grid, ONE card radius, one CTA, and a global heading rule. ── */
:root{
  /* T1 — the venue's five, and what they are BEFORE a venue has set any.
     
     These are dowiz's own, derived by `Brand::shipped().theme()` and pasted
     from its output rather than typed: every value here passed the same
     contrast walk the branding editor runs, which is not true of a colour
     chosen by eye. The storefront wears the TENANT's brand, and `applyTheme`
     overwrites all of this the moment the menu arrives.
     
     What was here was a pink from a tenant assumption that no longer holds.
     It appeared nowhere else in the product, and because it is what paints
     before the menu loads, every visit to a gold-themed venue opened with a
     flash of somebody else's colour. */
  --brand-primary:#9b6b21; --brand-primary-hover:#825a1c; --brand-secondary:#457b9d;
  /* Text ON the primary. A token rather than a literal #fff, because a venue
     that adopts its own colours has that pair contrast-checked on the server —
     and a hardcoded white cannot be checked or changed. */
  --brand-on-primary:#ffffff;
  --brand-primary-light:#f5ead6;
  --brand-bg:#fbfaf8; --brand-surface-raised:#f7f5f2;
  --brand-text:#1a1a1a;
  --brand-text-muted:#6c6c6c;
  --brand-border:#e8e3d8;

  /* Immutable across every preset and theme — DESIGN.md §1. */
  --st-PENDING:#D97706; --st-CONFIRMED:#2563EB; --st-PREPARING:#F59E0B;
  --st-READY:#0D9488; --st-IN_DELIVERY:#3B82F6; --st-DELIVERED:#059669;
  --st-REJECTED:#DC2626; --st-CANCELLED:#DC2626;

  --brand-font-heading:Georgia,'Iowan Old Style','Times New Roman',serif;
  --brand-font-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;

  /* One type scale. The audit's drift came from two scales disagreeing at
     xl/2xl/3xl, so there is exactly one here and nothing sets a raw size. */
  --text-base:1rem;
  --weight-normal:400;

  /* 4px grid. DESIGN.md §3: "Only these values. Never 6px, 10px, 14px, 18px." */
  --space-10:40px;

  /* ONE card radius, the audit's fix #3. The tenant's own token is 8px and it wins. */
  --radius-xl:16px;
  --radius-card:var(--radius-md);
  --radius-btn:var(--radius-full); --z-backdrop:300; --z-modal:400;
  --bar-h:calc(68px + env(safe-area-inset-bottom,0px));
  --ease:cubic-bezier(.2,.8,.2,1);

  /* ── §8.1 T2 DOWIZ-FIXED ──
     Never overridable by a venue. --font-mono is what makes a price a price:
     the plan calls its absence a "real gap", and it is — proportional digits
     make a column of totals jitter as it updates, and a 0 indistinguishable
     from an O in an order number read down a phone. */
  /* The ζ vocabulary. Motion is never a raw cubic-bezier at a call site:
     SNAP ζ=1 for taps and toggles, TIDE ζ>1 for the Sea, which drifts and
     never settles. */
  }
/* Dark mode is a red line in deliveryos-ui: no screen ships without it. Tokens
   only — not one component rule lives inside this block, which is what stops a
   colour existing in one theme and not the other. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --brand-primary:#d69a3d;
    --brand-bg:#141210; --brand-surface:#1f1d1a; --brand-surface-raised:#2a2723;
    --brand-text:#f3f2f2; --brand-text-muted:#a9a193; --brand-border:#3e3932;
    --brand-primary-light:#2a2015;
  }
}
:root[data-theme="dark"]{
  --brand-primary:#d69a3d;
  --brand-bg:#141210; --brand-surface:#1f1d1a; --brand-surface-raised:#2a2723;
  --brand-text:#f3f2f2; --brand-text-muted:#a9a193; --brand-border:#3e3932;
  --brand-primary-light:#2a2015;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--brand-font-body);background:var(--brand-bg);color:var(--brand-text);
     min-height:100vh;min-height:100dvh;line-height:1.5;font-size:var(--text-base);
     -webkit-font-smoothing:antialiased;padding-bottom:var(--bar-h)}
/* THE GLOBAL HEADING RULE. Its absence is finding T1 in the audit and the reason
   the same dish name rendered in two different fonts on two screens. */
h1,h2,h3{font-family:var(--brand-font-heading);font-weight:var(--weight-normal);
         letter-spacing:-.02em;line-height:1.12;text-wrap:balance}
p{text-wrap:pretty}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand-primary);outline-offset:2px;border-radius:var(--radius-sm)}
.i{font-size:1.15em;line-height:1;vertical-align:-.12em}
/* ── Sea ── the field layer. Fixed, behind everything, pointer-transparent.
   The spectral edge is the seam the design language calls the dowiz signature:
   a thin gradient where the Sheet meets the Sea rather than a hard cut. */
#sea{position:fixed;inset:0;z-index:0;pointer-events:none;
     opacity:.55;transition:opacity .6s ease-out}
#sea.calm{opacity:.3}
/* NOT `body>*:not(#sea)`: the :not(#sea) gives that selector id-level
   specificity (1,0,1), which beats .top/.bar/.sheet/.scrim/.toast/.offline and
   silently replaces their sticky/fixed with relative -- the header stops
   sticking and the cart bar stops being pinned. Only #app needs a stacking
   context; everything else already carries a z-index above the Sea. */
#app{position:relative;z-index:1}
.hero{position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--brand-primary),transparent);
  opacity:.35}
@media (prefers-reduced-motion:reduce){ #sea{opacity:.18} }
.wrap{max-width:720px;margin:0 auto;padding-inline:var(--space-4)}

/* Movement removed, meaning kept. Zeroing every duration also removes the fade
   that tells you the sheet opened. */
@media (prefers-reduced-motion:reduce){
  *{animation-iteration-count:1!important}
  .dish:hover,.dish:active,.btn:active{transform:none!important}
  .bar,.sheet,.toast{transition-property:opacity!important;transform:none!important}
  .skel::after,.step.now .dot::after{animation:none!important}
}

/* ── header ── */
.top{position:sticky;top:0;z-index:var(--z-sticky);
     background:var(--brand-bg);
     background:color-mix(in srgb,var(--brand-bg) 90%,transparent);
     backdrop-filter:blur(12px);border-bottom:1px solid var(--brand-border)}
.brand{font-family:var(--brand-font-heading);font-size:var(--text-xl);flex:1;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langs{display:flex;gap:2px;background:var(--brand-surface-raised);border-radius:var(--radius-full);padding:var(--space-1)}
.lang{min-width:36px;min-height:32px;border:0;background:none;border-radius:var(--radius-full);
      font-size:var(--text-xs);font-weight:var(--weight-bold);letter-spacing:.04em;
      text-transform:uppercase;color:var(--brand-text-muted);cursor:pointer}
.lang[aria-pressed="true"]{background:var(--brand-surface);color:var(--brand-text);box-shadow:var(--elevation-1)}

/* ── hero ── */
.hero{padding-block:var(--space-6) var(--space-4)}
.hero h1{font-size:clamp(var(--text-2xl),7vw,var(--text-3xl));margin-bottom:var(--space-2)}
.hero .meta{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);
            color:var(--brand-text-muted);font-size:var(--text-sm)}
.hero .meta b{color:var(--brand-text);font-weight:var(--weight-medium)}
.status-dot{display:inline-flex;align-items:center;gap:var(--space-2);font-weight:var(--weight-medium)}
.status-dot::before{content:"";width:8px;height:8px;border-radius:var(--radius-full);background:var(--color-success)}
.status-dot.closed::before{background:var(--brand-text-muted)}
.status-dot.busy::before{background:var(--color-warning)}

/* ── category nav ── */
.cats{position:sticky;top:56px;z-index:calc(var(--z-sticky) - 10);background:var(--brand-bg);
      border-bottom:1px solid var(--brand-border);margin-bottom:var(--space-2)}
.cats-in{display:flex;gap:var(--space-2);overflow-x:auto;scrollbar-width:none;
         padding:var(--space-3) var(--space-4);max-width:720px;margin:0 auto;
         scroll-snap-type:x proximity}
.cats-in::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;min-height:36px;padding:var(--space-2) var(--space-4);
     border:1px solid var(--brand-border);background:var(--brand-surface);
     border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:var(--weight-medium);
     white-space:nowrap;cursor:pointer;scroll-snap-align:start;
     transition:background .15s ease-out,border-color .15s ease-out,color .15s ease-out}
.cat[aria-current="true"]{background:var(--brand-primary);border-color:var(--brand-primary);color:var(--brand-on-primary)}

/* ── dishes ── */
.sec-h{font-size:var(--text-xl);margin:var(--space-6) 0 var(--space-3);scroll-margin-top:112px}
.dishes{display:grid;gap:var(--space-3)}
.dish{display:grid;grid-template-columns:1fr 104px;gap:var(--space-4);
      background:var(--brand-surface);border:1px solid var(--brand-border);
      border-radius:var(--radius-card);padding:var(--space-4);text-align:left;width:100%;
      cursor:pointer;box-shadow:var(--elevation-1);
      transition:transform .16s var(--ease),box-shadow .16s var(--ease)}
@media (hover:hover) and (pointer:fine){
  .dish:hover{transform:translateY(-1px);box-shadow:var(--elevation-2)}
}
.dish:active{transform:scale(.995)}
.dish-name{font-family:var(--brand-font-heading);font-size:var(--text-lg);
           line-height:1.2;margin-bottom:var(--space-1);display:block}
.dish-desc{color:var(--brand-text-muted);font-size:var(--text-sm);line-height:1.45;display:-webkit-box;
           -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dish-price{margin-top:var(--space-2);font-weight:var(--weight-bold);
            font-size:var(--text-base);font-variant-numeric:tabular-nums;display:block}
.dish-media{border-radius:var(--radius-md);overflow:hidden;position:relative;
            aspect-ratio:1;background:var(--brand-surface-raised)}
.dish-media img{width:100%;height:100%;object-fit:cover}
/* The brief names "160px empty grey image placeholders" as the thing to kill, so
   a dish with no photo gets a deliberate mark whose hue is a stable hash of its
   name: the same dish looks the same on every visit. */
.fallback{width:100%;height:100%;display:grid;place-items:center;
          font-family:var(--brand-font-heading);font-size:var(--text-2xl);color:#fff;
          text-shadow:0 1px 6px rgba(0,0,0,.25)}
.sold-out .dish-media::after{content:"";position:absolute;inset:0;
                             background:var(--brand-bg);
                             background:color-mix(in srgb,var(--brand-bg) 72%,transparent)}
.sold-out .dish-name,.sold-out .dish-desc,.sold-out .dish-price{opacity:.55}
.badge{display:inline-block;margin-top:var(--space-2);padding:var(--space-1) var(--space-3);
       border-radius:var(--radius-full);background:var(--brand-surface-raised);
       color:var(--brand-text-muted);font-size:var(--text-xs);font-weight:var(--weight-bold);
       text-transform:uppercase;letter-spacing:.05em}

/* ── ONE primary CTA. The audit found five signatures of this button. ── */
.btn{display:flex;align-items:center;justify-content:center;gap:var(--space-2);width:100%;
     min-height:var(--tap);padding:var(--space-3) var(--space-5);border:0;
     border-radius:var(--radius-btn);background:var(--brand-primary);color:var(--brand-on-primary);
     font-weight:var(--weight-bold);font-size:var(--text-base);cursor:pointer;
     /* An <a> may wear .btn (the Telegram follow link is one). Without this it
        arrives underlined and inheriting link colour, which is the same control
        rendered two different ways -- the exact inconsistency the token set
        exists to prevent. */
     text-decoration:none;
     transition:background .15s ease-out,transform .12s ease-out}
@media (hover:hover) and (pointer:fine){ .btn:hover{background:var(--brand-primary-hover)} }
.btn[disabled]{background:var(--brand-border);color:var(--brand-text-muted);cursor:not-allowed}
.btn-ghost{background:var(--brand-surface);color:var(--brand-text);border:1px solid var(--brand-border)}
@media (hover:hover) and (pointer:fine){ .btn-ghost:hover{background:var(--brand-surface-raised)} }
.pill{background:rgba(255,255,255,.22);padding:2px var(--space-3);
      border-radius:var(--radius-full);font-variant-numeric:tabular-nums}

/* ── cart bar ── */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-modal);background:var(--brand-surface);
     border-top:1px solid var(--brand-border);box-shadow:0 -4px 20px rgba(0,0,0,.08);
     padding:var(--space-3) var(--space-4) calc(var(--space-3) + env(safe-area-inset-bottom,0px));
     transform:translateY(110%);transition:transform .22s var(--ease)}
.bar.show{transform:none}
.bar-in{max-width:720px;margin:0 auto}

/* ── sheet ── */
.scrim{position:fixed;inset:0;z-index:var(--z-backdrop);background:rgba(33,37,41,.5);
       opacity:0;pointer-events:none;transition:opacity .18s var(--ease)}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-modal);background:var(--brand-surface);
       border-radius:var(--radius-xl) var(--radius-xl) 0 0;max-height:92vh;max-height:92dvh;overflow-y:auto;
       transform:translateY(100%);transition:transform .26s var(--ease);
       padding-bottom:calc(var(--space-4) + env(safe-area-inset-bottom,0px))}
.sheet.show{transform:none}
.sheet-in{max-width:720px;margin:0 auto;padding-inline:var(--space-4)}
.grab{width:40px;height:4px;border-radius:var(--radius-full);background:var(--brand-border);
      margin:var(--space-3) auto var(--space-2)}
.sheet h2{font-size:var(--text-xl);margin:var(--space-3) 0 var(--space-1)}
.sheet p{max-width:65ch}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
     padding-block:var(--space-3);border-bottom:1px solid var(--brand-border)}
.row:last-of-type{border-bottom:0}
.qty{display:flex;align-items:center;gap:var(--space-1);background:var(--brand-surface-raised);
     border-radius:var(--radius-full);padding:var(--space-1)}
.qty button{width:36px;height:36px;border:0;background:var(--brand-surface);
            border-radius:var(--radius-full);font-size:var(--text-lg);
            font-weight:var(--weight-bold);cursor:pointer;box-shadow:var(--elevation-1);
            transition:transform .12s ease-out}
.qty button:active{transform:scale(.92)}
.qty span{min-width:28px;text-align:center;font-weight:var(--weight-bold);font-variant-numeric:tabular-nums}
label{display:block;font-size:var(--text-sm);font-weight:var(--weight-medium);
      margin:var(--space-4) 0 var(--space-2);color:var(--brand-text-muted)}
input,textarea,select{width:100%;min-height:var(--tap);padding:var(--space-3) var(--space-4);
  border:1px solid var(--brand-border);border-radius:var(--radius-md);
  background:var(--brand-surface);font-size:var(--text-base)}
textarea{min-height:76px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--brand-text-muted)}
input:focus,textarea:focus,select:focus{border-color:var(--brand-primary);outline:none;
  box-shadow:0 0 0 3px var(--brand-primary-light)}
.err{color:var(--color-danger);font-size:var(--text-sm);margin-top:var(--space-2);
     font-weight:var(--weight-medium)}
/* Not a card inside a sheet. A rule and rhythm do the same job without nesting. */
/* The code field and its button share a line: one action on one input, so a
   stacked layout would read as two unrelated controls. */
/* The allergen tray opens under the find bar, full width, because fourteen
   chips wrap and a row that scrolls sideways hides half of them. */
.avoid{grid-column:1/-1;margin-top:var(--space-2);padding:var(--space-3);
      border:1px solid var(--brand-border);border-radius:var(--radius-md);
      background:var(--brand-surface)}
.avoid-in{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.avoid-h{margin:0 0 var(--space-2);color:var(--brand-text-muted);font-size:var(--text-xs)}
.avoid-in + .avoid-h{margin:var(--space-2) 0 0}
.linky{background:none;border:0;padding:0;font:inherit;color:var(--brand-primary);
      text-decoration:underline;cursor:pointer}
.promo-row{display:flex;gap:var(--space-2);align-items:stretch;margin-bottom:var(--space-2)}
.promo-row input{flex:1 1 auto;margin:0;text-transform:uppercase}
.promo-row .btn{flex:0 0 auto;width:auto;margin:0;padding-inline:var(--space-4)}
/* A discount is the one row in the totals that moves the number DOWN, so it is
   the one row that carries a colour. */
.totals .row.cut{color:var(--brand-primary)}
/* What will actually be charged, when the customer is reading another currency.
   Quiet on purpose: it is a clarification of the total above it, not a second
   total competing with it. */
.totals .row.note{font-size:var(--text-xs);color:var(--brand-text-muted);
                  padding-top:var(--space-1)}
.totals{margin-block:var(--space-4);padding-top:var(--space-4);border-top:1px solid var(--brand-border)}
.totals .row{padding-block:var(--space-2);border:0;font-size:var(--text-sm);color:var(--brand-text-muted)}
.totals .row.grand{font-size:var(--text-lg);font-weight:var(--weight-bold);color:var(--brand-text);
                   border-top:1px solid var(--brand-border);margin-top:var(--space-2);
                   padding-top:var(--space-3)}
.pays{display:grid;gap:var(--space-2)}
.pay{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);
     border:1.5px solid var(--brand-border);border-radius:var(--radius-card);
     background:var(--brand-surface);cursor:pointer;text-align:left;min-height:var(--tap)}
.pay[aria-checked="true"]{border-color:var(--brand-primary);background:var(--brand-primary-light)}
.pay .t{flex:1}
.pay .t b{display:block;font-size:var(--text-base);font-weight:var(--weight-semibold)}
.pay .t small{color:var(--brand-text-muted);font-size:var(--text-sm)}

/* ── tracking ── */
.track{display:grid;margin-block:var(--space-5)}
.step{display:grid;grid-template-columns:24px 1fr;gap:var(--space-4);
      padding-bottom:var(--space-5);position:relative}
.step::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--brand-border)}
.step:last-child::before{display:none}
.dot{width:24px;height:24px;border-radius:var(--radius-full);border:2px solid var(--brand-border);
     background:var(--brand-surface);display:grid;place-items:center;font-size:var(--text-xs);color:#fff}
.step.done .dot{background:var(--st-DELIVERED);border-color:var(--st-DELIVERED)}
.step.now .dot{background:var(--brand-primary);border-color:var(--brand-primary)}
.step.now .dot::after{content:"";width:8px;height:8px;border-radius:var(--radius-full);
                      background:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.step b{font-size:var(--text-base);font-weight:var(--weight-semibold)}
.step:not(.done):not(.now) b{color:var(--brand-text-muted);font-weight:var(--weight-normal)}

/* ── states ── */
.skel{position:relative;overflow:hidden;background:var(--brand-surface-raised);border-radius:var(--radius-card)}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--brand-surface) 70%,transparent),transparent);
  animation:sweep 1.3s ease-in-out infinite}
@keyframes sweep{to{transform:translateX(100%)}}
.empty{text-align:center;padding:var(--space-12) var(--space-5);color:var(--brand-text-muted)}
/* The technical reason, under the human sentence. Small and muted because it is
   for the one customer in fifty who will read it out over the phone, not for
   the other forty-nine. */
.empty .reason{display:block;margin-top:var(--space-2);font-size:var(--text-xs);
       opacity:.8;word-break:break-word}
.empty .btn{max-width:20rem;margin-inline:auto}
.empty b{display:block;font-family:var(--brand-font-heading);font-size:var(--text-lg);
         font-weight:var(--weight-normal);color:var(--brand-text);margin-bottom:var(--space-2)}
.notice{display:flex;gap:var(--space-3);align-items:flex-start;padding:var(--space-3) var(--space-4);
        border-radius:var(--radius-card);background:var(--brand-primary-light);
        border:1px solid var(--brand-border);font-size:var(--text-sm);margin-block:var(--space-3)}
/* The delivery-area answer. Colour is NOT the only signal -- the text says
   which it is -- because a red/green pair is invisible to about one man in
   twelve, and this one decides whether someone can order at all. */
/* ASAP / later, and the order history list.
   The two chips are one choice, so they read as a pair rather than as two
   buttons: same height as every other control, the selected one filled. */
.icon-btn{display:grid;place-items:center;width:var(--tap);height:var(--tap);
     border:0;border-radius:var(--radius-full);background:transparent;
     color:var(--brand-text);font-size:1.15rem;cursor:pointer}
.icon-btn:hover{background:var(--brand-surface-raised)}

/* ── find ──
   Search, sort and an availability filter, above the category rail. Sticky
   would fight the rail for the top of the screen, so it scrolls: a customer who
   has started reading the menu is past needing it. */
/* ── the choices on a dish ──
   Fieldsets, because they ARE groups and a screen reader should say so. The
   required marker is a word, not a colour or an asterisk: a customer who cannot
   see the red does not get to guess which group is the one blocking them. */
.mgroup{margin:var(--space-3) 0;padding:0;border:0}
.mgroup legend{padding:0 0 var(--space-2);font-weight:var(--weight-bold);
      font-size:var(--text-base);color:var(--brand-text)}
.mgroup .req{margin-left:var(--space-2);padding:1px var(--space-2);border-radius:var(--radius-full);
      background:var(--brand-surface-raised);color:var(--brand-text-muted);
      font-size:var(--text-xs);font-weight:var(--weight-medium);text-transform:lowercase}
.mopt{display:flex;align-items:center;gap:var(--space-3);min-height:var(--tap);
      padding:0 var(--space-2);border-radius:var(--radius-md);cursor:pointer}
.mopt:hover{background:var(--brand-surface-raised)}
.mopt input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--brand-primary)}
.mopt span:nth-of-type(1){flex:1 1 auto}
.mdelta{color:var(--brand-text-muted);font-size:var(--text-sm)}
/* Sold out stays VISIBLE and disabled: removing it makes a customer who came
   for it think the venue never had it. */
.mopt.off{opacity:.45;cursor:not-allowed}
.mopt.off input{cursor:not-allowed}
/* Three states, three treatments. The undeclared one is the loudest because it
   is the only one that means a question has gone unanswered. */
.allerg.unknown{color:var(--color-danger);font-weight:var(--weight-medium)}
.allerg.none{color:var(--brand-text-muted)}
.allerg{display:flex;align-items:center;gap:var(--space-2);margin:var(--space-2) 0 0;
      color:var(--color-warning);font-size:var(--text-sm)}

.find{display:grid;gap:var(--space-2);padding:0 var(--space-4) var(--space-3)}
.srch{display:flex;align-items:center;gap:var(--space-2);min-height:var(--tap);
      padding:0 var(--space-3);border:1px solid var(--brand-border);
      border-radius:var(--radius-btn);background:var(--brand-surface);
      color:var(--brand-text-muted)}
.srch:focus-within{border-color:var(--brand-primary);
      outline:2px solid var(--brand-primary);outline-offset:1px}
.srch input{flex:1 1 auto;min-width:0;border:0;background:none;outline:none;
      color:var(--brand-text);font:inherit;font-size:var(--text-base)}
/* The browser's own clear button would sit beside ours and do the same thing. */
.srch input::-webkit-search-cancel-button{display:none}
.srch button{display:grid;place-items:center;width:2rem;height:2rem;border:0;
      border-radius:var(--radius-full);background:none;color:var(--brand-text-muted);
      cursor:pointer}
.srch button:hover{background:var(--brand-surface-raised);color:var(--brand-text)}
.finds{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3)}
.finds select{min-height:var(--tap);padding:0 var(--space-3);
      border:1px solid var(--brand-border);border-radius:var(--radius-md);
      background:var(--brand-surface);color:var(--brand-text);
      font:inherit;font-size:var(--text-sm);cursor:pointer}
.chk{display:inline-flex;align-items:center;gap:var(--space-2);
      font-size:var(--text-sm);color:var(--brand-text);cursor:pointer}

.when{display:flex;gap:var(--space-2);margin-bottom:var(--space-3)}
.when .chip{flex:1 1 0;min-height:var(--tap);border-radius:var(--radius-btn);
     border:1px solid var(--brand-border);background:var(--brand-surface);
     color:var(--brand-text);font-size:var(--text-base);cursor:pointer}
.when .chip.on{background:var(--brand-primary);border-color:var(--brand-primary);
     color:var(--brand-on-primary);font-weight:var(--weight-bold)}
#f-when{width:100%;min-height:var(--tap);padding:0 var(--space-3);
     border:1px solid var(--brand-border);border-radius:var(--radius-md);
     background:var(--brand-surface);color:var(--brand-text);
     font-size:var(--text-base);margin-bottom:var(--space-3)}
.hist{display:flex;width:100%;align-items:center;justify-content:space-between;
     gap:var(--space-3);min-height:var(--tap);margin-bottom:var(--space-2);
     padding:0 var(--space-4);border:1px solid var(--brand-border);
     border-radius:var(--radius-md);background:var(--brand-surface);
     color:var(--brand-text);font-size:var(--text-base);cursor:pointer;text-align:left}
.hist:hover{border-color:var(--brand-primary)}
/* An order whose token has expired is SHOWN, greyed, rather than dropped: a
   customer who remembers ordering and sees nothing assumes the site lost it. */
.hist.gone{opacity:.55;cursor:default}
.hist .muted{color:var(--brand-text-muted);font-size:var(--text-sm)}

.geo{margin:0 0 var(--space-3);font-size:var(--text-sm);color:var(--brand-text-muted)}
.geo.ok{color:var(--color-success)}
.geo.bad{color:var(--color-danger)}

.notice a{color:var(--brand-primary);font-weight:var(--weight-bold)}
.offline{position:fixed;left:0;right:0;top:0;z-index:var(--z-toast);background:var(--color-warning);
         color:#fff;text-align:center;padding:var(--space-2) var(--space-4);
         font-size:var(--text-sm);font-weight:var(--weight-medium)}
.toast{position:fixed;left:var(--space-4);right:var(--space-4);bottom:calc(var(--bar-h) + var(--space-3));
       z-index:var(--z-toast);background:var(--brand-text);color:var(--brand-bg);
       padding:var(--space-3) var(--space-4);border-radius:var(--radius-card);
       box-shadow:var(--elevation-3);font-size:var(--text-sm);max-width:688px;margin:0 auto;
       opacity:0;transform:translateY(10px);pointer-events:none;
       transition:opacity .2s var(--ease),transform .2s var(--ease)}

/* ── §8.4(3) MONEY IS SACRED ──
   One rule, one place, three surfaces. Mono and tabular so digits sit in a
   column and a total does not shuffle sideways as it changes; never animated,
   because a number that counts up is a number that is briefly wrong, and this
   one is what somebody pays. The kernel hands over an integer and it is
   rendered, not interpolated and not rounded. */
</style>
</head>
<body>
<!-- SEA — the dowiz ambient layer. It lives BEHIND the Sheet and never carries
     text, a price or a decision: those are Sheet-owned by contract. Because every
     card sits on an opaque --brand-surface, the measured text contrast is
     unaffected by whatever the field is doing. -->
<canvas id="sea" aria-hidden="true"></canvas>
<div id="offline" class="offline" hidden></div>
<header class="top"><div class="wrap top-in">
  <span class="brand" id="brandName">…</span>
  <!-- Hidden until there is something to show: a "my orders" button that opens
       an empty list on a first visit is a promise the site has not kept yet. -->
  <button class="icon-btn" id="histBtn" type="button" title="Мої замовлення" hidden>
    <i class="ti ti-receipt" aria-hidden="true"></i><span class="sr">Мої замовлення</span></button>
  <!-- The currency is a READING, not the charge. Same control shape as the
       language switcher because it is the same kind of choice: how this page is
       rendered for me, changing nothing about the order. -->
  <div class="langs" role="group" aria-label="Currency" id="curs"></div>
  <div class="langs" role="group" aria-label="Language">
    <button class="lang" data-l="sq">sq</button>
    <button class="lang" data-l="en">en</button>
    <button class="lang" data-l="uk">uk</button>
  </div>
</div></header>
<main id="app" class="wrap" aria-live="polite"></main>
<div class="bar" id="bar"><div class="bar-in">
  <button class="btn" id="barBtn"><span id="barCount" class="pill">0</span><span id="barLabel">Cart</span><span id="barTotal" class="money"></span></button>
</div></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sheet-in" id="sheetIn"></div></div>
<!-- role=status + aria-live: a toast is the only notice of several actions
     (order sent, address checked, poll failing) and a silent one is no notice
     at all for anyone not looking at that corner of the screen. -->
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<!-- Stripe.js is loaded ONLY when the card rail is configured (app.js injects it
     after the menu says so), so a cash-only venue ships no payment SDK at all. -->
<script type="module" src="/app.js"></script>
</body>
</html>
