<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- The browser chrome must be a colour the page actually contains. These are
     --brand-bg in each shipped theme; app.js rewrites them to the venue's own
     paper the moment its theme arrives, so a dark venue gets a dark status bar. -->
<meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<!-- ONE VENUE'S NAME WAS BAKED INTO EVERY VENUE'S PAGE. The real name arrives
     with the catalogue; what belongs here is the platform. -->
<title>dowiz</title>
<!-- The storefront installs as the venue's own app: the manifest is written
     per venue by the Worker, and the icon links below are pointed at the
     venue's mark the moment it arrives (app.js). -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" id="favicon" href="data:,">
<link rel="apple-touch-icon" id="touchIcon" href="data:,">
<!-- NO WEB FONTS, by design: the type pairs are system-resident, chosen by the
     venue's theme, and paint instantly on a Durrës 3G connection. -->
<link rel="stylesheet" href="/lib/icons.css">
<link rel="stylesheet" href="/lib/tokens.css">
<link rel="stylesheet" href="/lib/components.css">
<!-- The design system (/lib/ui): after the shared tokens, before this surface's
     sheet, which keeps the venue's skin (store/parts.js says how). -->
<link rel="stylesheet" href="/lib/ui/ui.css">
<link rel="stylesheet" href="/store/store.css">
<link rel="modulepreload" href="/app.js">
<link rel="modulepreload" href="/store/state.js">
<link rel="modulepreload" href="/store/menu.js">
</head>
<body>
<!-- SEA — the dowiz ambient layer. It lives BEHIND the Sheet and never carries
     text, a price or a decision: those are Sheet-owned by contract. The veil
     above it keeps the top and bottom of the field darker than the middle, so
     the header and the bar read as chrome and the cards sit in the light. The
     grain is a film texture over everything: it is what makes a flat dark
     paper read as velvet rather than as a screen. -->
<canvas id="sea" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div id="offline" class="offline" hidden></div>

<header class="top"><div class="wrap top-in">
  <!-- The mark is hidden until the venue has one; the name is always there
       behind it, so a logo that does not load leaves a readable header. -->
  <img class="brand-mark" id="brandMark" alt="" width="40" height="40" hidden>
  <span class="brand" id="brandName">…</span>
  <!-- Two decisions, two controls: what I read in, what I count in. -->
  <button class="ui-iconbtn icon-btn glass" id="langBtn" type="button" data-tour="top.lang" data-t-attr="aria-label:language title:language">
    <i class="ti ti-torii ui-i" aria-hidden="true"></i></button>
  <button class="ui-iconbtn icon-btn glass cur-btn" id="curBtn" type="button" data-tour="top.currency" data-t-attr="aria-label:currency title:currency">
    <i class="ti ti-coin-hole ui-i" aria-hidden="true"></i><span class="cur-code money" id="curCode"></span></button>
</div></header>

<!-- The metal, for SVG strokes: the same foil the CSS draws, as a gradient any
     stroke on the page can refer to by id. The colours are the venue's accent
     lightened and darkened at runtime (app.js paints the stops). -->
<svg width="0" height="0" aria-hidden="true" class="defs"><defs>
  <linearGradient id="gold-stroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" class="stop-lo"/><stop offset=".3" class="stop-mid"/><stop offset=".52" class="stop-hi"/><stop offset=".74" class="stop-mid"/><stop offset="1" class="stop-lo"/>
  </linearGradient>
</defs></svg>
<main id="app" class="wrap" aria-live="polite"></main>

<!-- The floating order pill: count, label, total. A <Money> that snaps. -->
<button class="cart-pill" id="cartPill" type="button" data-tour="cart.open">
  <span class="pill-n" id="pillCount">0</span>
  <span class="pill-l" data-t="viewOrder">View order</span>
  <span class="money pill-t" id="pillTotal" data-money="0"></span>
</button>

<!-- Five tabs, glass, above the safe area. Filled by store/nav.js. -->
<nav class="nav" id="nav" aria-label="dowiz"></nav>

<div class="scrim" id="scrim"></div>
<!-- ONE sheet. It rises over the Sea with the tide easing and wears the
     spectral rim, which is the one dowiz mark on a venue's own surface. -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab" id="grab" aria-hidden="true"></div>
  <div class="sheet-in" id="sheetIn"></div>
</div>
<div class="ui-toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
<!-- Stripe.js is loaded ONLY when a card is chosen, so a cash-only venue ships no payment SDK. -->
<script type="module" src="/app.js"></script>
</body>
</html>
