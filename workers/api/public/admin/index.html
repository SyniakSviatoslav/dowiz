<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5efe5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#061b1a" media="(prefers-color-scheme: dark)">
<title>dowiz · admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" rel="stylesheet">
<style>
/* ── dowiz owner console ───────────────────────────────────────────────────────
   Register: PRODUCT (PRODUCT.md). A tool scanned during a rush, not a brand
   surface: Shopify Admin / Stripe density, Inter, 14px base, rectangular
   controls. It is the storefront's SIBLING, not its twin: the same token names
   (docs/design/DESIGN.md §1-§4, web/src/styles/tokens.css), the same 4px grid,
   the same IMMUTABLE semantic + status colours, the same motion standards --
   but dowiz's own chrome where the storefront wears the tenant's, rows where
   it has cards, and a calmer Sea. The chrome is the plan's T3 palette (§8.1:
   "owner-tool-frame = Warm Cosmo-Noir #d69a3d / #061b1a / #f5efe5"), the same
   values the courier surface wears, so the two dowiz-owned surfaces agree.

   Sea & Sheet (docs/design/dowiz-interfaces/DOWIZ-INTERFACES-PLAN.md §0, §2):
   every dowiz screen is a Sheet (content, money, DECISIONS -- opaque, crisp)
   over the Sea (dowiz ambient field), joined by a spectral edge. Here every
   status, amount and button sits on an opaque --brand-surface, so nothing the
   owner must read during a rush can be touched by whatever the field does. ── */
:root{
  /* T3 dowiz chrome -- light. Paper is the page GROUND, white the panel, ink
     the text; ink and paper swap roles in the dark theme (as on the courier),
     which is what keeps the two themes one design. */
  --brand-bg:#f5efe5; --brand-surface:#ffffff; --brand-surface-raised:#f5efe5;
  --brand-text:#061b1a;
  /* The courier's muted, not DESIGN.md's #6B7280: that one measures 4.23:1 on
     paper and fails. This carries the ink's own hue: 7.26:1 on white, 6.34:1
     on paper, 6.82:1 on the pending-row tint. */
  --brand-text-muted:#4a5a58;
  --brand-border:#d9d2c5;
  /* Gold is a GROUND, never a carrier of white: white on #d69a3d is 2.46:1,
     ink on it is 7.25:1 (hover ground #c98b2c: 6.12:1). The CTA always carries
     ink. Gold is also never text on a light ground (2.15:1 on paper). */
  --brand-primary:#d69a3d; --brand-primary-hover:#c98b2c; --brand-on-primary:#061b1a;
  /* The gold CTA's EDGE, not its fill. Gold on a light ground is 2.46:1 against
     white and 2.15:1 against paper -- under the 3:1 non-text floor, so the button
     is legible by its 7.25:1 ink label while its boundary is not delimited. Gold
     darkened 25% toward ink measures 3.91:1 on white and 3.42:1 on paper, which
     clears the floor without touching the palette the plan mandates. In dark the
     fill is already 6.49:1 against the sheet, so the edge collapses into it. */
  --primary-edge:#a27a34;
  /* Focus ring: ink in light (gold on white is 2.46:1, invisible), gold in
     dark (6.49:1 on the dark surface) -- the courier's rule. */
  --focus-ring:#061b1a;

  /* IMMUTABLE across every preset and theme -- DESIGN.md §1. Never redefined below. */
  --color-success:#059669; --color-warning:#D97706; --color-danger:#DC2626; --color-info:#2563EB;
  --st-PENDING:#D97706; --st-CONFIRMED:#2563EB; --st-PREPARING:#F59E0B;
  --st-READY:#0D9488; --st-IN_DELIVERY:#3B82F6; --st-DELIVERED:#059669;
  --st-REJECTED:#DC2626; --st-CANCELLED:#DC2626; --st-SCHEDULED:#7C3AED; --st-PICKED_UP:#0D9488;

  /* Derived inks. The immutable tokens above are the SOURCE; these are what is
     allowed to touch text, because a colour that is immutable in value cannot
     also be legible on every ground: #2563EB is 5.17:1 on white and 3.09:1 on
     #0b2624; #DC2626 is 4.83:1 on white and 3.30:1 on #0b2624. In light mode
     they ARE the tokens; dark mode redefines only these derived names. */
  --accent-ink:var(--color-info);      /* links               */
  --danger-ink:var(--color-danger);    /* danger outline text */
  /* A pending row's ground: the immutable PENDING amber at 6% over the white
     panel. Muted 6.82:1, link 4.86:1, danger 4.54:1 on it. */
  --row-attn:color-mix(in srgb,var(--st-PENDING) 6%,var(--brand-surface));
  --chip-mix:14%;
  --toggle-off:#d9d2c5; --toggle-thumb:#ffffff;
  --on-danger:#ffffff;                 /* 4.83:1 on --color-danger, both themes */
  --sea-opacity:.28; --sea-opacity-calm:.14;
  /* Spectral edge -- the dowiz seam, terracotta -> accent -> gold (plan §2.4),
     the courier's exact stops: one seam across the dowiz-owned surfaces. */
  --spectral-a:#b5541c; --spectral-b:#f2c14e;
  --spectral:linear-gradient(90deg,transparent 0%,var(--spectral-a) 30%,var(--brand-primary) 50%,var(--spectral-b) 70%,transparent 100%);

  --brand-font-body:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,monospace;

  /* Type scale = web/src/styles/tokens.css (11/12/14/16/20/24/36), in rem.
     14px base is the product register's density; nothing sets a raw size. */
  --text-xs:.6875rem; --text-sm:.75rem; --text-base:.875rem; --text-lg:1rem;
  --text-xl:1.25rem; --text-2xl:1.5rem; --text-3xl:2.25rem;
  --weight-normal:400; --weight-medium:500; --weight-semibold:600; --weight-bold:700;
  --leading-tight:1.25; --leading-normal:1.5;

  /* 4px grid. DESIGN.md §3: "Only these values. Never 6px, 10px, 14px, 18px." */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-8:32px; --space-12:48px; --space-16:64px;

  --radius-sm:4px; --radius-md:8px; --radius-lg:12px; --radius-full:9999px;

  --elevation-1:0 1px 3px rgba(0,0,0,.12);
  --elevation-2:0 4px 12px rgba(0,0,0,.15);
  --elevation-3:0 8px 24px rgba(0,0,0,.18);
  --z-sticky:200; --z-backdrop:300; --z-modal:400; --z-toast:500;

  --tap:44px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
/* Dark mode: a red line in deliveryos-ui. Three states -- bare :root light,
   system dark unless the page was explicitly set light, explicit dark. Tokens
   ONLY. Not one component rule lives inside a theme block, which is what stops
   a colour existing in one theme and not the other. Values are the courier
   surface's dark theme, verbatim: ink becomes the ground, paper the text, and
   gold stays gold with ink on it (7.25:1 does not depend on the theme). */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --brand-bg:#061b1a; --brand-surface:#0b2624; --brand-surface-raised:#12302d;
    --brand-text:#f5efe5; --brand-text-muted:#a9b8b5; --brand-border:#22403c;
    --focus-ring:#d69a3d; --primary-edge:#d69a3d;                                             /* 6.49:1 on #0b2624 */
    --accent-ink:color-mix(in srgb,var(--color-info) 65%,#ffffff);   /* 5.78:1 on #0b2624 */
    --danger-ink:color-mix(in srgb,var(--color-danger) 60%,#ffffff); /* 5.87:1 on #0b2624 */
    --row-attn:color-mix(in srgb,var(--st-PENDING) 12%,var(--brand-surface)); /* muted 6.72:1 */
    --chip-mix:18%;
    --toggle-off:#22403c; --toggle-thumb:#f5efe5;
    --sea-opacity:.4; --sea-opacity-calm:.2;
  }
}
:root[data-theme="dark"]{
  --brand-bg:#061b1a; --brand-surface:#0b2624; --brand-surface-raised:#12302d;
  --brand-text:#f5efe5; --brand-text-muted:#a9b8b5; --brand-border:#22403c;
  --focus-ring:#d69a3d;
  --accent-ink:color-mix(in srgb,var(--color-info) 65%,#ffffff);
  --danger-ink:color-mix(in srgb,var(--color-danger) 60%,#ffffff);
  --row-attn:color-mix(in srgb,var(--st-PENDING) 12%,var(--brand-surface));
  --chip-mix:18%;
  --toggle-off:#22403c; --toggle-thumb:#f5efe5;
  --sea-opacity:.4; --sea-opacity-calm:.2;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--brand-font-body);background:var(--brand-bg);color:var(--brand-text);
     font-size:var(--text-base);line-height:var(--leading-normal);min-height:100dvh;
     -webkit-font-smoothing:antialiased;
     padding-bottom:calc(var(--space-16) + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;border-radius:var(--radius-sm)}
[hidden]{display:none!important}
.i{font-size:1.15em;line-height:1;vertical-align:-.12em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:960px;margin:0 auto;padding-inline:var(--space-4)}
h1,h2,h3{line-height:var(--leading-tight);letter-spacing:-.01em;text-wrap:balance}

/* ── Sea ── fixed, behind everything, pointer-transparent. Calmer than the
   storefront's (.55): this is a tool, and the field is weather behind the
   window, not the view. The plan's owner Act 1 is "the field IS the business"
   -- each order a ripple, volume = amplitude -- and that is exactly what it is
   wired to in app.js. It carries no text, no price, no decision. */
#sea{position:fixed;inset:0;z-index:0;pointer-events:none;
     opacity:var(--sea-opacity);transition:opacity .6s ease-out}
#sea.calm{opacity:var(--sea-opacity-calm)}
/* Only the main column needs lifting above the canvas; the header and toast
   carry their own position + z-index. A `body>*:not(#sea)` rule here would
   have id-level specificity and silently un-stick the header. */
#app{position:relative;z-index:1}

/* Movement removed, meaning kept: fades and colour survive, travel does not.
   Zeroing every duration would also remove the fade that says a toast arrived. */
@media (prefers-reduced-motion:reduce){
  *{animation-iteration-count:1!important}
  .btn:active,.tab:active,.vstatus:active{transform:none!important}
  .toast{transition-property:opacity!important;transform:none!important}
  .order.is-new{animation-name:fade!important}
  .skel::after{animation:none!important}
  .sw span::after{transition:none!important}
  #sea{opacity:var(--sea-opacity-calm)}
}

/* ── header ── the tool's chrome. The spectral edge is its bottom seam. */
.top{position:sticky;top:0;z-index:var(--z-sticky);background:var(--brand-surface);
     border-bottom:1px solid var(--brand-border)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
            background:var(--spectral);opacity:.6;pointer-events:none}
.top-in{display:flex;align-items:center;gap:var(--space-3);min-height:56px}
.logo{font-weight:var(--weight-bold);font-size:var(--text-lg);letter-spacing:-.01em}
.spacer{flex:1}
.vstatus{display:inline-flex;align-items:center;gap:var(--space-2);min-height:var(--tap);
         padding:0 var(--space-4);border-radius:var(--radius-full);
         border:1px solid var(--brand-border);background:var(--brand-surface);cursor:pointer;
         font-weight:var(--weight-semibold);font-size:var(--text-sm);
         transition:background .15s ease-out,transform .12s ease-out}
.vstatus .d{width:8px;height:8px;border-radius:var(--radius-full);background:var(--brand-text-muted);flex:0 0 auto}
.vstatus.open .d{background:var(--color-success)}
.vstatus.busy .d{background:var(--color-warning)}
.vstatus:active{transform:scale(.97)}
.vstatus[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:var(--tap);height:var(--tap);
          border:1px solid var(--brand-border);background:var(--brand-surface);
          border-radius:var(--radius-md);cursor:pointer;font-size:var(--text-xl);
          transition:background .15s ease-out,transform .12s ease-out}
.icon-btn:active{transform:scale(.94)}

/* ── stats ── one strip, hairlines between cells (1px grid gap over the border
   colour), label before value, 20px tabular figures. Not the hero-metric
   template: nothing is big, nothing is decorated, and the revenue is text set
   from a server integer -- there is no animated path to it anywhere. */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;
       background:var(--brand-border);border:1px solid var(--brand-border);
       border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--elevation-1);
       margin-block:var(--space-4)}
.stat{background:var(--brand-surface);padding:var(--space-3) var(--space-4)}
.stat .k{color:var(--brand-text-muted);font-size:var(--text-sm);font-weight:var(--weight-medium)}
.stat .v{font-size:var(--text-xl);font-weight:var(--weight-semibold);margin-top:var(--space-1);
         font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:var(--leading-tight)}

/* ── tabs ── underline tabs on the page ground (Shopify Admin). Muted text on
   the ground measures 4.59:1; the raised grey would have been 4.39:1. */
.tabs{display:flex;gap:var(--space-2);border-bottom:1px solid var(--brand-border);margin-bottom:var(--space-4)}
.tab{display:inline-flex;align-items:center;gap:var(--space-2);min-height:var(--tap);
     padding:0 var(--space-3);margin-bottom:-1px;border:0;background:none;
     border-bottom:2px solid transparent;font-weight:var(--weight-medium);
     font-size:var(--text-base);color:var(--brand-text-muted);cursor:pointer;white-space:nowrap;
     transition:color .15s ease-out,border-color .15s ease-out}
.tab[aria-selected="true"]{color:var(--brand-text);border-bottom-color:var(--brand-text);font-weight:var(--weight-semibold)}
.tab .n{font-size:var(--text-xs);font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums;
        padding:0 var(--space-2);min-width:20px;line-height:20px;border-radius:var(--radius-full);
        background:var(--brand-surface-raised);color:var(--brand-text)}
.tab:active{transform:translateY(1px)}

/* ── panel ── the Sheet. Orders are ROWS inside one surface with hairline
   dividers, not a stack of cards: cards are the lazy answer, and nested cards
   (the old menu view) are always wrong. */
/* ── setup pane ──
   Two one-off jobs: import the menu, take the colours off a photo. Composed as
   REPEATED CARDS with identical edges, padding and heading treatment, so the
   two read as one thing done twice rather than two features bolted on. Nothing
   here introduces a colour, a radius or a spacing step of its own -- every value
   is a token this file already defines. */
.setup{display:grid;gap:var(--space-4);padding:var(--space-4);background:none;border:0;box-shadow:none}
.setup .card{background:var(--brand-surface-raised);border:1px solid var(--brand-border);
       border-radius:var(--radius-md);padding:var(--space-4);display:grid;gap:var(--space-3)}
.setup h2{margin:0;font-size:var(--text-lg);font-weight:var(--weight-semibold);color:var(--brand-text)}
.setup .hint{margin:0;color:var(--brand-text-muted);font-size:var(--text-sm);line-height:1.5}
.setup .row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3)}
/* The file input itself is unreachable by design: a <label class="btn"> gives
   the platform picker a control that matches every other button on the page,
   which the native widget never will. It stays focusable via the input. */
.setup .file{position:relative;overflow:hidden;width:auto;cursor:pointer}
.setup .file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.setup .file:focus-within{outline:2px solid var(--focus-ring);outline-offset:2px}
.setup .check{display:inline-flex;align-items:center;gap:var(--space-2);
       font-size:var(--text-sm);color:var(--brand-text);cursor:pointer}
.setup .report{font-size:var(--text-sm);color:var(--brand-text);display:grid;gap:var(--space-2)}
.setup .report p{margin:0}
.setup summary{cursor:pointer;color:var(--brand-text-muted)}
/* A rejected row is information, not an alarm: it is listed in the muted voice
   with a danger rule at the edge, so ten of them do not read as ten errors. */
.setup .warn{margin:var(--space-2) 0 0;padding:0 0 0 var(--space-4);list-style:none;
       border-left:2px solid var(--danger-ink);display:grid;gap:var(--space-1);
       color:var(--brand-text-muted)}
.setup .pairs{margin:0;padding:0;list-style:none;display:grid;gap:var(--space-1)}
.setup .pairs li{display:flex;align-items:center;gap:var(--space-2)}
.setup .pairs .ok{color:var(--brand-text-muted)}
.setup .pairs .bad{color:var(--danger-ink);font-weight:var(--weight-semibold)}
.setup .swatches{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.setup .swatch{display:inline-flex;align-items:center;gap:var(--space-2);min-height:var(--tap);
       padding:0 var(--space-3);border:1px solid var(--brand-border);border-radius:var(--radius-md);
       background:var(--brand-surface);color:var(--brand-text);font-size:var(--text-sm);cursor:pointer}
.setup .swatch:hover{border-color:var(--brand-primary)}
.setup .swatch:disabled{opacity:.55;cursor:progress}
/* A ring on the chip, so a near-white swatch is still visible as a swatch
   against a near-white card rather than disappearing into it. */
.setup .chipc{width:20px;height:20px;border-radius:var(--radius-full);
       box-shadow:inset 0 0 0 1px rgb(0 0 0/.18)}

.panel{background:var(--brand-surface);border:1px solid var(--brand-border);
       border-radius:var(--radius-md);box-shadow:var(--elevation-1);margin-bottom:var(--space-4);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4);
         font-size:var(--text-sm);font-weight:var(--weight-semibold);color:var(--brand-text-muted);
         text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--brand-border)}

/* ── order row ── */
.order{padding:var(--space-4);border-bottom:1px solid var(--brand-border)}
.order:last-child{border-bottom:0}
/* A pending order needs the owner. It gets a tinted GROUND (measured for both
   inks) and a pulsing status dot -- not a side stripe, which impeccable bans
   outright, and not a pulsing shadow, which is not a GPU property. */
.order.attn{background:var(--row-attn)}
/* New during a rush: rises 6px into place, once, staggered 40ms. Its rest state
   is fully visible -- the keyframe has no `to`, so if it never runs the row is
   simply there. */
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes fade{from{opacity:0}}
.order.is-new{animation:rise .24s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms)}
.o-h{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-2);flex-wrap:wrap}
.oid{font-family:var(--font-mono);font-size:var(--text-sm);color:var(--brand-text-muted);font-variant-numeric:tabular-nums}
.amt{margin-left:auto;font-weight:var(--weight-bold);font-variant-numeric:tabular-nums;font-size:var(--text-lg)}
.lines{font-size:var(--text-base);color:var(--brand-text-muted);margin-bottom:var(--space-2);text-wrap:pretty}
.lines b{color:var(--brand-text);font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums}
.who{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-4);font-size:var(--text-base);
     margin-bottom:var(--space-3);align-items:center}
.who>span{display:inline-flex;align-items:center;gap:var(--space-1)}
.who .i{color:var(--brand-text-muted)}
.muted{color:var(--brand-text-muted)}
.tel{display:inline-flex;align-items:center;gap:var(--space-1);min-height:var(--tap);
     color:var(--accent-ink);font-weight:var(--weight-semibold);text-decoration:underline;
     text-underline-offset:3px;text-decoration-thickness:1px;font-variant-numeric:tabular-nums;
     transition:color .15s ease-out}
.tel .i{color:inherit}
.acts{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.acts .btn.pri{flex:1 1 160px}
.wait{display:inline-flex;align-items:center;gap:var(--space-2);min-height:var(--tap);
      color:var(--brand-text-muted);font-size:var(--text-base)}

/* ── assign a courier ──
   Sized from the SAME tokens as .wait and .btn, because it stands where both of
   them stand: a READY order shows this control, an IN_DELIVERY one shows .wait,
   and a row must not change height as an order moves between them. The native
   <select> is kept rather than replaced with a custom menu -- on a phone it
   opens the platform picker, which is larger, scrollable and reachable with one
   thumb during a rush, and no hand-rolled dropdown here would beat that. */
.assign{display:inline-flex;align-items:center;min-height:var(--tap)}
.assign select{min-height:var(--tap);padding:0 var(--space-3);
      border:1px solid var(--brand-border);border-radius:var(--radius-md);
      background:var(--brand-surface-raised);color:var(--brand-text);
      font-size:var(--text-base);cursor:pointer}
.assign select:hover{border-color:var(--brand-primary)}
.assign select:disabled{opacity:.55;cursor:progress}

/* ── status chip ── DESIGN.md §5: coloured dot + text label; PENDING and
   IN_DELIVERY pulse. The LABEL carries the status (ink on a tint, 9.6:1 at
   worst); the dot is reinforcement in the immutable status colour, and two of
   those colours (#F59E0B, #D97706) cannot reach 3:1 on a light ground at any
   tint -- so nothing here depends on the dot alone. */
.chip{display:inline-flex;align-items:center;gap:var(--space-2);min-height:24px;
      padding:0 var(--space-2);border-radius:var(--radius-full);
      font-size:var(--text-xs);font-weight:var(--weight-semibold);
      text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;
      background:color-mix(in srgb,var(--st,var(--brand-text-muted)) var(--chip-mix),var(--brand-surface));
      color:var(--brand-text)}
.chip i{width:8px;height:8px;border-radius:var(--radius-full);background:var(--st,var(--brand-text-muted));flex:0 0 auto}
.chip.PENDING{--st:var(--st-PENDING)}
.chip.CONFIRMED{--st:var(--st-CONFIRMED)}
.chip.PREPARING{--st:var(--st-PREPARING)}
.chip.READY{--st:var(--st-READY)}
.chip.IN_DELIVERY{--st:var(--st-IN_DELIVERY)}
.chip.DELIVERED{--st:var(--st-DELIVERED)}
.chip.REJECTED{--st:var(--st-REJECTED)}
.chip.CANCELLED{--st:var(--st-CANCELLED)}
.chip.SCHEDULED{--st:var(--st-SCHEDULED)}
.chip.PICKED_UP{--st:var(--st-PICKED_UP)}
@keyframes pulse{50%{opacity:.35}}
.chip.PENDING i,.chip.IN_DELIVERY i{animation:pulse 1.2s ease-in-out infinite}

/* ── buttons ── one geometry, three surfaces. 44px targets, 8px radius (not
   the storefront's pill: sibling, not twin). Press = scale(.97), 120ms.
   The primary is gold with INK on it (7.25:1) -- the courier's CTA rule. Gold
   sits at hue 36; the immutable PREPARING (#F59E0B, hue 38) and PENDING
   (#D97706, hue 32) are the same family, 1.14:1 and 1.30:1 apart. On this
   surface a status hue is only ever an 8px dot or a 6-18% tint, never a fill;
   the only solid gold block is the action, and it carries a verb. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);
     min-height:var(--tap);padding:0 var(--space-4);border:1px solid var(--brand-border);
     background:var(--brand-surface);color:var(--brand-text);border-radius:var(--radius-md);
     font-weight:var(--weight-semibold);font-size:var(--text-base);cursor:pointer;
     transition:background .15s ease-out,border-color .15s ease-out,transform .12s ease-out}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--brand-primary);border-color:var(--primary-edge);color:var(--brand-on-primary)}
.btn.dan{background:var(--brand-surface);border-color:var(--danger-ink);color:var(--danger-ink)}
.btn.wide{width:100%;margin-top:var(--space-5)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
@media (hover:hover) and (pointer:fine){
  .btn:hover{background:var(--brand-surface-raised)}
  .btn.pri:hover{background:var(--brand-primary-hover);border-color:var(--brand-primary-hover)}
  /* Inverts rather than tints: #DC2626 text is 4.83:1 on white and drops under
     4.5:1 on ANY red tint (4.41:1 at 6%), while white on #DC2626 holds 4.83:1. */
  .btn.dan:hover{background:var(--color-danger);border-color:var(--color-danger);color:var(--on-danger)}
  .btn[disabled]:hover{background:var(--brand-surface)}
  .btn.pri[disabled]:hover{background:var(--brand-primary)}
  .vstatus:hover,.icon-btn:hover{background:var(--brand-surface-raised)}
  .tab:hover{color:var(--brand-text)}
  .tel:hover{text-decoration-thickness:2px}
}

/* ── menu rows ── */
.prod{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-4);
      border-bottom:1px solid var(--brand-border);min-height:var(--space-12)}
.prod:last-child{border-bottom:0}
.prod .n{flex:1;min-width:0}
.prod .n b{display:block;font-weight:var(--weight-semibold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod .n small{color:var(--brand-text-muted);font-size:var(--text-sm)}
.prod.off .n b{color:var(--brand-text-muted)}
.prod input[type=number]{width:96px;min-height:var(--tap);padding:0 var(--space-3);
      border:1px solid var(--brand-border);border-radius:var(--radius-md);background:var(--brand-surface);
      text-align:right;font-variant-numeric:tabular-nums;font-weight:var(--weight-medium)}
/* Toggle: DESIGN.md §5 46x26 track, 20px thumb, wrapped in a 44px hit area.
   ON is --color-success rather than the ink primary: "in sale" is a state the
   owner reads at a glance in a rush, and green already means open in the header. */
.sw{position:relative;display:inline-grid;place-items:center;width:var(--space-12);height:var(--tap);flex:0 0 auto;cursor:pointer}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span{position:relative;width:46px;height:26px;background:var(--toggle-off);border-radius:var(--radius-full);
         transition:background .15s ease-out}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:var(--toggle-thumb);
                border-radius:var(--radius-full);box-shadow:var(--elevation-1);transition:transform .15s var(--ease)}
.sw input:checked + span{background:var(--color-success)}
.sw input:checked + span::after{transform:translateX(20px)}
.sw input:active + span::after{transform:scale(.92)}
.sw input:checked:active + span::after{transform:translateX(20px) scale(.92)}
.sw input:focus-visible + span{outline:2px solid var(--focus-ring);outline-offset:2px}

/* ── login ── a Sheet over the Sea. */
.login{max-width:360px;margin:var(--space-16) auto;padding:var(--space-6);
       background:var(--brand-surface);border:1px solid var(--brand-border);
       border-radius:var(--radius-md);box-shadow:var(--elevation-1)}
.login h1{font-size:var(--text-2xl);font-weight:var(--weight-bold);margin-bottom:var(--space-1)}
.login p{color:var(--brand-text-muted);margin-bottom:var(--space-4)}
label{display:block;font-size:var(--text-sm);font-weight:var(--weight-medium);color:var(--brand-text-muted);
      margin:var(--space-3) 0 var(--space-1)}
input[type=email],input[type=password],input[type=text]{width:100%;min-height:var(--tap);
  padding:0 var(--space-3);border:1px solid var(--brand-border);border-radius:var(--radius-md);
  background:var(--brand-surface)}
input::placeholder{color:var(--brand-text-muted)}
input:focus{border-color:var(--focus-ring);outline:none;
            box-shadow:0 0 0 3px color-mix(in srgb,var(--focus-ring) 25%,transparent)}
.err{display:flex;gap:var(--space-2);align-items:flex-start;color:var(--danger-ink);
     font-size:var(--text-sm);font-weight:var(--weight-medium);margin-top:var(--space-3)}

/* ── states ── */
.empty{text-align:center;padding:var(--space-12) var(--space-4);color:var(--brand-text-muted)}
.empty .i{font-size:var(--text-3xl);display:block;margin-bottom:var(--space-3)}
.empty b{display:block;color:var(--brand-text);font-size:var(--text-lg);font-weight:var(--weight-semibold);margin-bottom:var(--space-1)}
.skel{position:relative;overflow:hidden;height:96px;margin-bottom:var(--space-4);
      background:var(--brand-surface-raised);border-radius:var(--radius-md)}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--brand-surface) 70%,transparent),transparent);
  animation:sweep 1.3s ease-in-out infinite}
@keyframes sweep{to{transform:translateX(100%)}}
.toast{position:fixed;left:var(--space-4);right:var(--space-4);
       bottom:calc(var(--space-4) + env(safe-area-inset-bottom,0px));z-index:var(--z-toast);
       background:var(--brand-text);color:var(--brand-bg);padding:var(--space-3) var(--space-4);
       border-radius:var(--radius-md);box-shadow:var(--elevation-3);max-width:928px;margin:0 auto;
       font-size:var(--text-base);font-weight:var(--weight-medium);
       opacity:0;transform:translateY(8px);pointer-events:none;
       transition:opacity .2s var(--ease),transform .2s var(--ease)}
.toast.show{opacity:1;transform:none}
</style>
</head>
<body>
<!-- SEA: the dowiz ambient layer, behind the Sheet. No text, no price, no
     decision lives here; every status the owner reads sits on an opaque
     surface above it. -->
<canvas id="sea" aria-hidden="true"></canvas>
<header class="top" id="top" hidden><div class="wrap top-in">
  <span class="logo">dowiz</span>
  <span class="spacer"></span>
  <button class="vstatus" id="vstatus" title="Змінити статус закладу"><span class="d" aria-hidden="true"></span><span id="vstatusT">—</span></button>
  <button class="icon-btn" id="logout" aria-label="Вийти" title="Вийти"><i class="ti ti-logout" aria-hidden="true"></i></button>
</div></header>
<main id="app" class="wrap" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="/admin/app.js"></script>
</body>
</html>
