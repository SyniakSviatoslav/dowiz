<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f6f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<title>dowiz · food delivery</title>
<meta name="robots" content="noindex">
<!-- Installability. The manifest carries the name, the scope and the icons; the
     worker at /kit/sw.js supplies the fetch handler a browser requires before
     it will offer an install. iOS reads none of that and needs its own three. -->
<link rel="manifest" href="/kit/manifest.webmanifest">
<link rel="apple-touch-icon" href="/kit/img/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="dowiz">
<meta name="application-name" content="dowiz">
<!-- Tokens first, then the kit's components. Both external, because
     `style-src 'self'` (public/_headers) drops an inline <style> outright --
     which is exactly the bug that made every dowiz surface render unstyled. -->
<link rel="stylesheet" href="/lib/figma.css">
<link rel="stylesheet" href="/kit/kit.css">
<!-- One stylesheet per WORKSTREAM, not per screen. kit.css is the ported Figma
     kit and is edited by the design pass; these two carry what the catalogue
     and the dish detail add on top, so two people can work at once without
     meeting in the same 98 KB file. -->
<link rel="stylesheet" href="/kit/catalogue.css">
<link rel="stylesheet" href="/kit/detail.css">
<!-- The font is the largest thing on the critical path and is same-origin. -->
<link rel="preload" href="/lib/font/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script type="module" src="/kit/app.js"></script>
</body>
</html>
