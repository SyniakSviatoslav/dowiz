<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5efe5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#061b1a" media="(prefers-color-scheme: dark)">
<title>dowiz · головний хаб</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/lib/icons.css">
<link rel="stylesheet" href="/lib/tokens.css">
<style>
/* ── dowiz platform console ───────────────────────────────────────
   The main hub: where a client's hub is created. dowiz's OWN surface, so it
   wears the same T3 chrome as the owner console and the courier app rather
   than a tenant's brand -- the tokens below are that surface's, copied rather
   than re-chosen, because a fourth spelling of the same palette is how the
   three drifted apart the first time. */
:root{
  /* T3 dowiz chrome -- light. Paper is the page GROUND, white the panel, ink
     the text; ink and paper swap roles in the dark theme (as on the courier),
     which is what keeps the two themes one design. */
  --brand-bg:#f5efe5; --brand-surface-raised:#f5efe5;
  --brand-text:#061b1a;
  /* The courier's muted, not DESIGN.md's #6B7280: that one measures 4.23:1 on
     paper and fails. This carries the ink's own hue: 7.26:1 on white, 6.34:1
     on paper, 6.82:1 on the pending-row tint. */
  --brand-text-muted:#4a5a58;
  --brand-border:#d9d2c5;
  /* Gold is a GROUND, never a carrier of white: white on #d69a3d is 2.46:1,
     ink on it is 7.25:1 (hover ground #c98b2c: 6.12:1). The CTA always carries
     ink. Gold is also never text on a light ground (2.15:1 on paper). */
  --brand-primary:#d69a3d; --brand-primary-hover:#c98b2c; --brand-on-primary:#061b1a;
  /* The gold CTA's EDGE, not its fill. Gold on a light ground is 2.46:1 against
     white and 2.15:1 against paper -- under the 3:1 non-text floor, so the button
     is legible by its 7.25:1 ink label while its boundary is not delimited. Gold
     darkened 25% toward ink measures 3.91:1 on white and 3.42:1 on paper, which
     clears the floor without touching the palette the plan mandates. In dark the
     fill is already 6.49:1 against the sheet, so the edge collapses into it. */
  --primary-edge:#a27a34;
  /* Focus ring: ink in light (gold on white is 2.46:1, invisible), gold in
     dark (6.49:1 on the dark surface) -- the courier's rule. */
  --focus-ring:#061b1a;

  /* IMMUTABLE across every preset and theme -- DESIGN.md §1. Never redefined below. */
  --st-PENDING:#D97706; --st-CONFIRMED:#2563EB; --st-PREPARING:#F59E0B;
  --st-READY:#0D9488; --st-IN_DELIVERY:#3B82F6; --st-DELIVERED:#059669;
  --st-REJECTED:#DC2626; --st-CANCELLED:#DC2626; --st-SCHEDULED:#7C3AED; --st-PICKED_UP:#0D9488;

  /* Derived inks. The immutable tokens above are the SOURCE; these are what is
     allowed to touch text, because a colour that is immutable in value cannot
     also be legible on every ground: #2563EB is 5.17:1 on white and 3.09:1 on
     #0b2624; #DC2626 is 4.83:1 on white and 3.30:1 on #0b2624. In light mode
     they ARE the tokens; dark mode redefines only these derived names. */
  --accent-ink:var(--color-info);      /* links               */
  --danger-ink:var(--color-danger);    /* danger outline text */
  /* A pending row's ground: the immutable PENDING amber at 6% over the white
     panel. Muted 6.82:1, link 4.86:1, danger 4.54:1 on it. */
  --row-attn:var(--brand-surface);
  --row-attn:color-mix(in srgb,var(--st-PENDING) 6%,var(--brand-surface));
  --chip-mix:14%;
  --toggle-off:#d9d2c5; --toggle-thumb:#ffffff;
  --on-danger:#ffffff;                 /* 4.83:1 on --color-danger, both themes */
  --sea-opacity:.28; --sea-opacity-calm:.14;
  /* Spectral edge -- the dowiz seam, terracotta -> accent -> gold (plan §2.4),
     the courier's exact stops: one seam across the dowiz-owned surfaces. */
  --spectral-a:#b5541c; --spectral-b:#f2c14e;
  --spectral:linear-gradient(90deg,transparent 0%,var(--spectral-a) 30%,var(--brand-primary) 50%,var(--spectral-b) 70%,transparent 100%);

  --brand-font-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;

  /* Type scale = web/src/styles/tokens.css (11/12/14/16/20/24/36), in rem.
     14px base is the product register's density; nothing sets a raw size. */
  --text-base:.875rem; --weight-normal:400;
  /* 4px grid. DESIGN.md §3: "Only these values. Never 6px, 10px, 14px, 18px." */
  --z-backdrop:300; --z-modal:400;
  --ease:cubic-bezier(.2,.8,.2,1);

  /* ── §8.1 T2 DOWIZ-FIXED ──
     the plan calls its absence a "real gap", and it is — proportional digits
     make a column of totals jitter as it updates, and a 0 indistinguishable
     from an O in an order number read down a phone. */
  /* The ζ vocabulary. Motion is never a raw cubic-bezier at a call site:
     SNAP ζ=1 for taps and toggles, TIDE ζ>1 for the Sea, which drifts and
     never settles. */
  }
/* Dark mode: a red line in deliveryos-ui. Three states -- bare :root light,
   system dark unless the page was explicitly set light, explicit dark. Tokens
   ONLY. Not one component rule lives inside a theme block, which is what stops
   a colour existing in one theme and not the other. Values are the courier
   surface's dark theme, verbatim: ink becomes the ground, paper the text, and
   gold stays gold with ink on it (7.25:1 does not depend on the theme). */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --brand-bg:#061b1a; --brand-surface:#0b2624; --brand-surface-raised:#12302d;
    --brand-text:#f5efe5; --brand-text-muted:#a9b8b5; --brand-border:#22403c;
    --focus-ring:#d69a3d; --primary-edge:#d69a3d;                                             /* 6.49:1 on #0b2624 */
    --accent-ink:var(--color-info);
    --accent-ink:color-mix(in srgb,var(--color-info) 65%,#ffffff);   /* 5.78:1 on #0b2624 */
    --danger-ink:var(--color-danger);
    --danger-ink:color-mix(in srgb,var(--color-danger) 60%,#ffffff); /* 5.87:1 on #0b2624 */
    --row-attn:var(--brand-surface);
    --row-attn:color-mix(in srgb,var(--st-PENDING) 12%,var(--brand-surface)); /* muted 6.72:1 */
    --chip-mix:18%;
    --toggle-off:#22403c; --toggle-thumb:#f5efe5;
    --sea-opacity:.4; --sea-opacity-calm:.2;
  }
}
:root[data-theme="dark"]{
  --brand-bg:#061b1a; --brand-surface:#0b2624; --brand-surface-raised:#12302d;
  --brand-text:#f5efe5; --brand-text-muted:#a9b8b5; --brand-border:#22403c;
  --focus-ring:#d69a3d;
  --accent-ink:var(--color-info);
  --accent-ink:color-mix(in srgb,var(--color-info) 65%,#ffffff);
  --danger-ink:var(--color-danger);
  --danger-ink:color-mix(in srgb,var(--color-danger) 60%,#ffffff);
  --row-attn:var(--brand-surface);
  --row-attn:color-mix(in srgb,var(--st-PENDING) 12%,var(--brand-surface));
  --chip-mix:18%;
  --toggle-off:#22403c; --toggle-thumb:#f5efe5;
  --sea-opacity:.4; --sea-opacity-calm:.2;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--brand-bg);color:var(--brand-text);
     font-family:var(--brand-font-body);font-size:var(--text-base);line-height:1.5;
     min-height:100dvh;padding:var(--space-5) var(--space-4)}
.wrap{max-width:var(--measure);margin:0 auto;display:grid;gap:var(--space-4)}
header{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-2)}
.mark{width:var(--space-6);height:var(--space-6);border-radius:var(--radius-md);
      background:var(--brand-primary);color:var(--brand-on-primary);
      display:grid;place-items:center;font-weight:var(--weight-bold)}
h1{font-size:var(--text-xl);font-weight:var(--weight-semibold);letter-spacing:-.01em}
h2{font-size:var(--text-lg);font-weight:var(--weight-semibold);margin-bottom:var(--space-2)}
.sub{color:var(--brand-text-muted);font-size:var(--text-sm)}
.card{background:var(--brand-surface);border:1px solid var(--brand-border);
      border-radius:var(--radius-md);box-shadow:var(--elevation-1);padding:var(--space-4)}
label{display:block;font-size:var(--text-sm);font-weight:var(--weight-medium);
      margin-bottom:var(--space-1)}
input{width:100%;min-height:var(--tap);padding:0 var(--space-3);
      border:1px solid var(--brand-border);border-radius:var(--radius-sm);
      background:var(--brand-bg);color:var(--brand-text);font:inherit}
input:focus-visible{outline:2px solid var(--focus-ring);outline-offset:1px}
.field{margin-bottom:var(--space-3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
@media (max-width:30rem){.two{grid-template-columns:1fr}}
.btn{min-height:var(--tap);padding:0 var(--space-4);border-radius:var(--radius-sm);
     border:1px solid var(--brand-border);background:var(--brand-surface);
     color:var(--brand-text);font:inherit;font-weight:var(--weight-medium);
     cursor:pointer;display:inline-flex;align-items:center;gap:var(--space-2);
     transition:background 120ms var(--ease-snap)}
.btn.pri{background:var(--brand-primary);color:var(--brand-on-primary);
         border-color:var(--brand-primary)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.hint{color:var(--brand-text-muted);font-size:var(--text-sm)}
.hub{display:flex;align-items:flex-start;gap:var(--space-3);
     padding:var(--space-3) 0;border-top:1px solid var(--brand-border)}
.hub:first-child{border-top:0}
.hub .grow{flex:1 1 auto;min-width:0}
.hub a{color:var(--accent-ink);text-decoration:none;word-break:break-all}
.hub a:hover{text-decoration:underline}
.tag{flex:0 0 auto;font-size:var(--text-xs);font-weight:var(--weight-semibold);
     text-transform:uppercase;letter-spacing:.04em;padding:2px var(--space-2);
     border:1px solid var(--brand-border);border-radius:var(--radius-full);
     color:var(--brand-text-muted)}
.said{margin-top:var(--space-3);padding:var(--space-3);border-radius:var(--radius-sm);
      border:1px solid var(--brand-border);background:var(--brand-bg);
      font-size:var(--text-sm);white-space:pre-wrap}
.said.bad{border-color:var(--danger-ink);color:var(--danger-ink)}
.said.good{border-color:var(--color-success)}
.hidden{display:none}
/* Money has one styling in one place on every surface, including the one that
   renders none -- so the rule cannot be invented differently the day it does. */
.money{font-family:var(--font-mono);font-variant-numeric:tabular-nums;
       font-feature-settings:"tnum" 1;letter-spacing:-.01em}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark" aria-hidden="true">d</div>
    <div>
      <h1>Головний хаб</h1>
      <div class="sub" id="who">dowiz · платформа</div>
    </div>
  </header>

  <section class="card" id="signin">
    <h2>Вхід</h2>
    <p class="hint">Тільки для адміністраторів платформи.</p>
    <div class="field" style="margin-top:var(--space-3)">
      <label for="email">Пошта</label>
      <input id="email" type="email" autocomplete="username" inputmode="email">
    </div>
    <div class="field">
      <label for="pw">Пароль</label>
      <input id="pw" type="password" autocomplete="current-password">
    </div>
    <button class="btn pri" id="go">Увійти</button>
    <div class="said bad hidden" id="signinSaid" role="alert"></div>
  </section>

  <section class="card hidden" id="hubs">
    <h2>Хаби клієнтів</h2>
    <div id="hubList"><p class="hint">Завантаження…</p></div>
  </section>

  <section class="card hidden" id="create">
    <h2>Створити хаб</h2>
    <p class="hint">Адреса буде <code>&lt;slug&gt;.<span id="pHost">dowiz.org</span></code>.
       Це стає іменем у DNS, тому тільки малі літери, цифри та дефіс.</p>
    <div class="two" style="margin-top:var(--space-3)">
      <div class="field"><label for="slug">Slug</label>
        <input id="slug" placeholder="sushi-durres" autocapitalize="off" spellcheck="false"></div>
      <div class="field"><label for="name">Назва</label>
        <input id="name" placeholder="Sushi Durrës"></div>
    </div>
    <div class="field"><label for="phone">Телефон</label>
      <input id="phone" placeholder="+355 …" inputmode="tel"></div>
    <h2 style="margin-top:var(--space-4)">Перший власник</h2>
    <p class="hint">Можна лишити порожнім — хаб створиться без власника.</p>
    <div class="two" style="margin-top:var(--space-3)">
      <div class="field"><label for="oemail">Пошта власника</label>
        <input id="oemail" type="email" autocomplete="off"></div>
      <div class="field"><label for="opw">Пароль</label>
        <input id="opw" type="text" autocomplete="off"></div>
    </div>
    <button class="btn pri" id="make">Створити</button>
    <div class="said hidden" id="makeSaid" role="status"></div>
  </section>
</div>
<script type="module" src="/platform/app.js"></script>
</body>
</html>
