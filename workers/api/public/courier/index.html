<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12161C">
<title>dowiz · кур'єр</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.9.0/dist/maplibre-gl.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Uber Eats Driver is the reference the brief names, and its rules are physical:
   the map dominates, the UI is a sheet on top of it, there is ONE action at a
   time, and nothing read while moving is below 16px. Everything here is sized
   for a thumb on a scooter, not a cursor. */
:root{
  --bg:#12161C; --sheet:#FFFFFF; --ink:#12161C; --muted:#5B6672; --line:#E3E7EC;
  --accent:#1D4ED8; --success:#0F7B47; --warning:#B45309; --danger:#C1121F;
  --cta:60px;            /* the brief says 56+; 60 leaves room for gloves */
  --r:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;font-size:16px;background:var(--bg);color:var(--ink);
     -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

#map{position:fixed;inset:0;bottom:38dvh}
.maplibregl-ctrl-attrib{font-size:10px}

.hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:5;
     display:flex;gap:8px;align-items:center}
.hud .tag{background:rgba(18,22,28,.86);color:#fff;padding:8px 13px;border-radius:999px;
          font-size:14px;font-weight:600;backdrop-filter:blur(8px)}
.hud .tag.warn{background:var(--warning)}
.hud .sp{flex:1}

.sheet{position:fixed;left:0;right:0;bottom:0;height:38dvh;min-height:300px;z-index:10;
       background:var(--sheet);border-radius:20px 20px 0 0;box-shadow:0 -6px 28px rgba(0,0,0,.28);
       display:flex;flex-direction:column;
       padding-bottom:env(safe-area-inset-bottom,0px)}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 4px;flex:0 0 auto}
.sheet-in{flex:1;overflow-y:auto;padding:6px 16px 12px;-webkit-overflow-scrolling:touch}

h2{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-bottom:2px}
.sub{color:var(--muted);font-size:15px;margin-bottom:12px}
.addr{font-size:18px;font-weight:600;line-height:1.3;margin:10px 0 4px}
.note{color:var(--muted);font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;margin:12px 0;font-size:15px}
.meta b{font-variant-numeric:tabular-nums}
.cash{display:inline-flex;align-items:center;gap:7px;background:#FFF4E5;color:var(--warning);
      padding:7px 13px;border-radius:999px;font-weight:700}

.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:var(--cta);
     border:0;border-radius:var(--r);background:var(--accent);color:#fff;font-size:18px;font-weight:700;
     cursor:pointer;margin-top:8px}
.cta:active{transform:scale(.99)}
.cta.go{background:var(--success)}
.cta.off{background:#EEF1F4;color:var(--ink)}
.cta[disabled]{opacity:.55}
.ghost{width:100%;min-height:50px;border:1px solid var(--line);background:#fff;border-radius:var(--r);
       font-size:16px;font-weight:600;margin-top:8px;cursor:pointer}
a.ghost{display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}

.task{border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:9px}
.task .r1{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.task .r1 b{font-size:17px}
.task .r1 .amt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:26px 12px;color:var(--muted);font-size:16px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:5px}
.login{padding:26px 18px}
label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:14px 0 6px}
input{width:100%;min-height:52px;padding:13px 15px;border:1px solid var(--line);border-radius:var(--r);
      font-size:17px}
.err{color:var(--danger);font-size:15px;font-weight:600;margin-top:10px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(38dvh + 12px);z-index:20;background:var(--ink);
       color:#fff;padding:14px 16px;border-radius:var(--r);font-size:16px;opacity:0;
       transform:translateY(8px);pointer-events:none;transition:opacity .18s,transform .18s}
.toast.show{opacity:1;transform:none}
</style>
</head>
<body>
<div id="map"></div>
<div class="hud">
  <span class="tag" id="shiftTag">офлайн</span>
  <span class="sp"></span>
  <span class="tag" id="gpsTag" hidden>GPS</span>
</div>
<div class="sheet"><div class="grab"></div><div class="sheet-in" id="app" aria-live="polite"></div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>
<script type="module" src="/courier/app.js"></script>
</body>
</html>
