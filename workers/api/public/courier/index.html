<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<!-- PINCH ZOOM STAYS. `maximum-scale=1,user-scalable=no` was here to stop iOS
     zooming when a field is focused, and the cost was that a courier could not
     enlarge an address they were squinting at on a wet phone in the dark. That
     is the one screen where zoom matters most, and WCAG 1.4.4 is not optional
     because a gesture is inconvenient. The focus-zoom problem has a real fix
     and it is below: inputs are 16px, which is the size iOS stops zooming at. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#061b1a">
<title>dowiz · courier</title>
<!-- The map library (932 KB raw, 245 KB gzipped, measured) is fetched only when
     a delivery is actually on screen -- see loadMapLibrary in app.js -- and it
     is served from this origin, so there is no third party left to preconnect
     to and nothing outside the venue's control between a courier and their map. -->
<link rel="stylesheet" href="/lib/icons.css">
<!-- NO WEB FONTS, AND THAT IS A DESIGN DECISION RATHER THAN A SAVING.
     
     These surfaces loaded two hundred kilobytes of render-blocking typeface
     from Google before anything could paint, and every customer's IP reached
     Google to do it -- on a service whose first invariant is local-first. The
     Cyrillic the console is written in needed a further subset again.
     
     What is lost is small: at fourteen to thirty-three pixels, on a phone, the
     difference between DM Sans and the system face is not what anyone notices.
     What Swiss typography actually asks for is the grid, the measure, the one
     ratio and the restraint -- Müller-Brockmann worked in Akzidenz-Grotesk
     because it was the face that was already there. The system stack is ours.
     
     It also renders instantly with no swap: no flash of fallback text, no
     layout shift when the real face arrives, nothing to wait for. -->

<link rel="stylesheet" href="/lib/tokens.css">
<link rel="stylesheet" href="/lib/components.css">
<link rel="stylesheet" href="/courier/courier.css">
</head>
<body>
<div id="map"></div>
<canvas id="sea" aria-hidden="true"></canvas>
<div class="hud">
  <span class="tag" id="shiftTag"><span class="dot" aria-hidden="true"></span><span id="shiftText" data-t="offline"></span></span>
  <span class="sp"></span>
  <span class="tag" id="gpsTag" hidden><i class="ti ti-gps i" aria-hidden="true"></i><span id="gpsText">GPS</span></span>
  <!-- The microphone sits in the HUD, reachable in EVERY state including
       mid-delivery, because that is exactly when a courier's hands are busy.
       Hidden entirely where the browser has no recogniser -- a button that
       cannot work is worse than no button. -->
  <button class="icon-btn" id="mic" type="button" aria-pressed="false"
          data-t-attr="aria-label:sayCommand title:voice" hidden>
    <i class="ti ti-microphone" aria-hidden="true"></i></button>
  <button class="icon-btn lang" id="langBtn" type="button" data-t-attr="aria-label:language title:language">SQ</button>
  <button class="icon-btn" id="themeBtn" type="button" data-t-attr="aria-label:theme title:theme"><i class="ti ti-sun-moon" aria-hidden="true"></i></button>
</div>
<!-- What was heard and what is about to happen. Above the sheet so it is
     readable at a glance without opening anything. -->
<div class="vsay" id="vsay" role="status" aria-live="polite" hidden></div>
<div class="vconfirm" id="vconfirm" hidden>
  <button class="cta go" id="vyes" type="button"><i class="ti ti-check" aria-hidden="true"></i><span data-t="yes"></span></button>
  <button class="ghost" id="vno" type="button"><i class="ti ti-x" aria-hidden="true"></i><span data-t="no"></span></button>
</div>
<section class="sheet" id="sheet" aria-label="dowiz">
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-in" id="app" aria-live="polite"></div>
</section>
<!-- aria-live: this is the only notice of a failed action for a courier
     who is looking at the road, not the screen. -->
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
<script type="module" src="/courier/app.js"></script>
</body>
</html>
