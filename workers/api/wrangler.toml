# dowiz API Worker. Build: `worker-build --release` compiles the Rust crate to
# wasm32 and emits the JS shim wrangler uploads.
name = "dowiz-api"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-15"

# account_id is deliberately NOT committed here. wrangler needs it in a
# non-interactive shell, but this repo carries a licence and may be public, so it
# is supplied as CLOUDFLARE_ACCOUNT_ID alongside the API token (both live outside
# the tree, mode 0600). Deploy with:
#   . /root/.cf_deploy_token && PATH="$HOME/.cargo/bin:$PATH" npx wrangler deploy
#
# THE FILE NAME MATTERS AND THIS LINE HAD THE WRONG ONE. /root/.cf_token holds a
# DIFFERENT token ('Bebop') which has API Tokens Write but NOT Workers Scripts
# Write, so a deploy with it builds the whole crate and then fails at upload with
# "Authentication error [code: 10000]" -- which reads as a broken token rather
# than as the wrong file. A deploy that looked like it ran, did not, and was
# believed, cost an afternoon of measuring the OLD code and concluding the fix
# had not worked. Verify a deploy by reading the script back, not by its exit.

[build]
command = "worker-build --release"

# The storefront ships WITH the API, from one Worker. Static files win for paths
# that exist on disk; /api/* has no file, so it falls through to the fetch
# handler. One deployment, one origin, no CORS to get wrong.
[assets]
directory = "./public"
binding = "ASSETS"

# D1 holds the order log. This replaces the native adapter's Mutex<HashMap>,
# which died with the process -- the reason no order ever survived a restart.
[[d1_databases]]
binding = "DB"
database_name = "dowiz"
database_id = "5467a3b0-5fb8-47d0-9680-4101666598d0"

# Workers Logs. The OpenTelemetry export rides on top of this later, through the
# kernel's own fdr::SpanObserver seam rather than a `tracing` dependency.
# Dish photographs. KV RATHER THAN THE DATABASE: a photo is an opaque blob read
# by URL and never queried, and D1 refuses anything over a million bytes, so an
# image would have to be split across rows and reassembled on every menu paint.
# KV is a key-value store reached by exactly the key the URL carries, and it is
# read from the edge cache rather than from the database.
#
# CONTENT-ADDRESSED: the key is the SHA-256 of the bytes, so uploading the same
# photograph twice stores it once and an image URL can be cached forever without
# an invalidation story.
[[kv_namespaces]]
binding = "MEDIA"
id = "0af8bfcd828e4802a4ec7f5bb399666f"

[observability]
enabled = true

# THE HUB'S IMAGES, one Durable Object per venue.
#
# `id_from_name(location_id)` means each venue gets its own object and its own
# storage, which is P67's hub-per-tenant arriving as a property of where the
# bytes live rather than as a column every query has to remember to filter on.
# The object outlives a request, so the image it serves is already in memory —
# the cost that used to grow with the venue's history.
[[durable_objects.bindings]]
name = "HUB"
class_name = "HubImages"

# `new_sqlite_classes`, NOT `new_classes`. Cloudflare refuses the latter on a
# free plan outright — "you must create a namespace using a new_sqlite_classes
# migration [code: 10097]" — which is also how this deployment learned it is on
# the free plan. The storage API used here is the same key/value one either way;
# the backend underneath it differs and nothing in `hubdo` can tell.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["HubImages"]
