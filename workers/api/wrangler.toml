# dowiz API Worker. Build: `worker-build --release` compiles the Rust crate to
# wasm32 and emits the JS shim wrangler uploads.
name = "dowiz-api"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-15"

# dowiz.org is the main hub; every client is a subdomain of it. The apex is a
# CUSTOM DOMAIN (wrangler creates and owns its DNS record); the clients are a
# WILDCARD ROUTE, because a route is the only form that can answer for a
# hostname created at the moment an administrator presses a button -- a custom
# domain per venue would mean a DNS write on every hub creation and a Cloudflare
# API token in the request path.
#
# THIS MUST STAY ABOVE EVERY `[table]` HEADER. It sat under `[vars]` for one
# deploy and TOML did exactly what TOML does: `routes` became an environment
# VARIABLE called `routes`, the Worker went up with no custom domain at all, and
# the deploy reported success. `env.routes` in the binding list was the tell.
# ROUTES ARE NOT MANAGED FROM THIS FILE, and that is forced rather than chosen.
# wrangler reconciles `routes` by first LISTING the zone's existing routes, and
# this deploy token cannot read `/zones/.../workers/routes` -- so any `routes`
# key at all, even one holding nothing but custom domains, fails the call and
# ABORTS THE WHOLE DEPLOY before the Worker is uploaded. The code then does not
# ship while the config looks correct, which is the worst of both.
#
# So the hostnames are attached out of band, through
# `/accounts/{id}/workers/domains`, which this token CAN write -- see
# `tools/platform/attach-host.sh`. The right end state is one wildcard route,
# `*.dowiz.org/*`, and it needs `Workers Routes:Edit` on the dowiz.org zone.
# account_id is deliberately NOT committed here. wrangler needs it in a
# non-interactive shell, but this repo carries a licence and may be public, so it
# is supplied as CLOUDFLARE_ACCOUNT_ID alongside the API token (both live outside
# the tree, mode 0600). Deploy with:
#   . /root/.cf_deploy_token && PATH="$HOME/.cargo/bin:$PATH" npx wrangler deploy
#
# THE FILE NAME MATTERS AND THIS LINE HAD THE WRONG ONE. /root/.cf_token holds a
# DIFFERENT token ('Bebop') which has API Tokens Write but NOT Workers Scripts
# Write, so a deploy with it builds the whole crate and then fails at upload with
# "Authentication error [code: 10000]" -- which reads as a broken token rather
# than as the wrong file. A deploy that looked like it ran, did not, and was
# believed, cost an afternoon of measuring the OLD code and concluding the fix
# had not worked. Verify a deploy by reading the script back, not by its exit.

# THE PLATFORM'S OWN HOST. Read by `serve_root` to decide whether `/` is a
# storefront or the main hub, and by `Place::slug_of_host` to decide whether a
# subdomain names a venue. It is a var rather than a constant so the workers.dev
# deployment keeps behaving like a single-venue hub: there, no host matches, the
# apex serves the storefront, and nothing below changes.
[vars]
PLATFORM_HOST = "dowiz.org"
# `LEGACY_VENUE` WAS HERE, and it is gone with the rows it named. It scoped the
# `hub_image` seed to the one venue that predated the Durable Objects; the D1
# binding, the migrations and `do_image`'s fallback have all been deleted, so
# there is no seed left to scope.
# THE WAITING LIST'S MAILBOX. A venue that leaves its address on dowiz.org is
# written to D1 (`waitlist`) and, when the `WAITLIST_MAIL` binding below is
# live, mailed to this address from the platform's own. The row is the record;
# the mail is the bell. Without the binding the row is still written and the
# hub console lists it, so nothing a venue typed is ever lost to a mail setup.
WAITLIST_TO = "syniaksviatoslav@proton.me"
WAITLIST_FROM = "waitlist@dowiz.org"

[build]
command = "worker-build --release"

# THE BELL FOR THE WAITING LIST. `send_email` needs Email Routing ENABLED on
# the dowiz.org zone and WAITLIST_TO VERIFIED as a destination address there
# (Cloudflare dashboard -> dowiz.org -> Email -> Email Routing). A binding to
# an unverified address fails the deploy, so it stays commented until both are
# true; the code treats the missing binding as "store only".
# Both true since 2026-09-20 17:00: Email Routing enabled on the zone (MX + SPF +
# DKIM written by Cloudflare), the address verified by the operator.
[[send_email]]
name = "WAITLIST_MAIL"
destination_address = "syniaksviatoslav@proton.me"

# The storefront ships WITH the API, from one Worker. Static files win for paths
# that exist on disk; /api/* has no file, so it falls through to the fetch
# handler. One deployment, one origin, no CORS to get wrong.
[assets]
directory = "./public"
binding = "ASSETS"
# ONLY THE ROOT, and only because the decision needs the Host header. One Worker
# serves two front doors that share a path: `sushi-durres.dowiz.org/` is that
# venue's storefront and `dowiz.org/` is the main hub. Assets answer before the
# Worker is reached, so without this the apex serves a storefront with no venue
# behind it. Every other path is still served straight from assets -- the
# storefront's own JS and CSS never touch the Worker.
run_worker_first = ["/"]

# Workers Logs. The OpenTelemetry export rides on top of this later, through the
# kernel's own fdr::SpanObserver seam rather than a `tracing` dependency.
# Dish photographs. KV RATHER THAN THE DATABASE: a photo is an opaque blob read
# by URL and never queried, and D1 refuses anything over a million bytes, so an
# image would have to be split across rows and reassembled on every menu paint.
# KV is a key-value store reached by exactly the key the URL carries, and it is
# read from the edge cache rather than from the database.
#
# CONTENT-ADDRESSED: the key is the SHA-256 of the bytes, so uploading the same
# photograph twice stores it once and an image URL can be cached forever without
# an invalidation story.
[[kv_namespaces]]
binding = "MEDIA"
id = "0af8bfcd828e4802a4ec7f5bb399666f"

# LESSON VIDEOS (Wave L, L7). Served only through /api/learn/* (src/learn.rs) to a signed-in
# owner, staff member or courier -- never as a static asset, which could not be gated. Written
# by tools/learn/publish.sh --r2 under `learn/`.
[[r2_buckets]]
binding = "LEARN"
bucket_name = "dowiz-learn"

[observability]
enabled = true
# One request in ten is logged. Unsampled, this is the biggest line on the bill
# at forty venues; the errors that matter are written by `console_error!` inside
# a sampled trace, so keep an eye on that when a failure needs chasing.
head_sampling_rate = 0.1

# THE HUB'S IMAGES, one Durable Object per venue.
#
# `id_from_name(location_id)` means each venue gets its own object and its own
# storage, which is P67's hub-per-tenant arriving as a property of where the
# bytes live rather than as a column every query has to remember to filter on.
# The object outlives a request, so the image it serves is already in memory —
# the cost that used to grow with the venue's history.
[[durable_objects.bindings]]
name = "HUB"
class_name = "HubImages"

# `new_sqlite_classes`, NOT `new_classes`. Cloudflare refuses the latter on a
# free plan outright — "you must create a namespace using a new_sqlite_classes
# migration [code: 10097]" — which is also how this deployment learned it is on
# the free plan. The storage API used here is the same key/value one either way;
# the backend underneath it differs and nothing in `hubdo` can tell.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["HubImages"]

# Nightly off-site copy for every venue that set a bucket (src/cloud.rs, NIGHTLY_CRON).
[triggers]
# TWO CRONS. The nightly is the off-site copy, the rotation, the prune and the
# witness -- a long job over every venue. The minute one drains the outbox: a
# kitchen waiting to be told about an order cannot wait until 03:17, and the
# sweep costs one platform read plus a 204 from each venue with nothing queued.
crons = ["17 3 * * *", "* * * * *"]
