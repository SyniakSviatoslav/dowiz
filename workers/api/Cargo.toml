[package]
name = "dowiz-api-worker"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Cloudflare Worker surface for dowiz. Transport + storage ONLY: every order decision is made by dowiz-kernel's json_api, never re-implemented here."

[lib]
crate-type = ["cdylib"]

[dependencies]
# workers-rs — the Cloudflare Workers runtime binding. This replaces the axum
# native-spa-server for PRODUCTION: axum/tokio/rustls cannot run on Workers.
worker = "0.8"
# NO NEW SUPPLY CHAIN: futures-util is already in the lock file as a transitive
# dependency of `worker` at this exact version, so declaring it direct adds no
# code to the build -- it only makes `join` nameable from here.
futures-util = { version = "0.3", default-features = false }

worker-macros = "0.8"
# The kernel: the SOLE order/FSM/money authority. `json-api` is the string
# boundary WITHOUT wasm-bindgen, so the Worker links the same JSON authority the
# native adapter uses. Measured cost of this link, size-optimised: ~98 KB raw /
# ~48 KB gzip against the Worker's 64 MiB uncompressed budget.
dowiz-kernel = { path = "../../kernel", features = ["json-api"] }
# The hub: one tenant's order log over a bebop store. Pure logic, no I/O -- this
# crate supplies the bytes and persists them.
dowiz-hub = { path = "../../crates/dowiz-hub" }
# The SAME crate the kernel links (no new crate in the graph): named directly so
# the money law (`tax::RatePpm`, `tax::summarise`) is reachable without the
# kernel facade re-exporting it. BLUEPRINT-TAX-PRICE-CHANNEL §3.2.
dowiz-core = { path = "../../crates/dowiz-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Auth primitives, all wasm32-clean and pure Rust -- no WebCrypto plumbing and no
# native C. HMAC-SHA256 signs the tokens; see auth.rs for why the old service's
# RS256 was deliberately NOT carried over to a Worker.
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
subtle = "2"
# Password hashing. argon2id is the old service's choice and it is kept: this is
# the one place slowness is the point.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
password-hash = { version = "0.6", features = ["alloc", "getrandom"] }
# getrandom on wasm32 has to be told to use the platform RNG explicitly.
getrandom = { version = "0.2", features = ["js"] }
# A table's QR code, drawn server-side (A9, `table_qr`). MIT, ZERO dependencies,
# pure Rust -- builds for wasm32 like the rest.
qrcodegen = "1.8"

# Size-and-startup profile. The kernel's own [profile.release] targets native
# SPEED (opt-level 3, thin LTO); a Worker is judged on bundle size and the 1s
# startup budget instead. Profile comes from the crate being built, so this
# governs the kernel too WITHOUT touching kernel/Cargo.toml.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# strip MUST stay false. With `strip = true` wasm-bindgen dies with
#   error: failed to generate catch wrappers
#   Caused by: externref table required for catch wrappers
# because stripping removes the sections it needs to place the externref table
# that the panic-recovery catch wrappers stand on. Measured, not guessed: a build
# with strip=true plus `--growable-table`/`--export-table` link args still failed,
# and a build with strip=false and NO extra link args succeeded -- so strip is the
# whole cause and those link args are not needed. The alternative is
# `worker-build --no-panic-recovery`, which drops automatic reinitialisation after
# a WebAssembly.RuntimeError; keeping the symbols is cheaper than losing that.
# Bundle after wasm-opt: ~447 KB wasm + 22 KB JS against a 64 MiB limit.
strip = false
