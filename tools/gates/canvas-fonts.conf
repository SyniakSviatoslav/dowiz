<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The browser gates' fonts: the first frame measures text, and the cost of finding a font grows with
     every font the machine has installed. A fixed set keeps that number about the board. -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <cachedir>/tmp/dowiz-canvas-fontcache</cachedir>
</fontconfig>
