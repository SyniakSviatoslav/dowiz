[package]
name = "bebop-log"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "The bebop chained event log over a bebop image: EvLog v1/v2 records, the crc quarantine policy, ChainMark. no_std + alloc; depends only on bebop-image."

[features]
default = []
# EvLog::init / append / set_tip over a path.
std = ["bebop-image/std"]

[dependencies]
bebop-image = { path = "../bebop-image" }

[dev-dependencies]
# the tests write temp files through the path API
bebop-image = { path = "../bebop-image", features = ["std"] }
# W-MG-M1: the REAL ML-DSA-65 seal (`doc/dsa_tests.rs`) through the `doc::Signer` /
# `doc::Verifier` seams. DEV ONLY: dowiz-core is AGPL-3.0-or-later and never links into this
# MIT OR Apache-2.0 library -- `cargo tree -e no-dev` must keep showing bebop-image alone.
# Zero dependencies of its own (pure core + alloc).
dowiz-core = { path = "../dowiz-core" }

[profile.release]
opt-level = 3

# ML-DSA-65 at opt-level 0 is seconds per signature; the test seals a dozen times.
[profile.dev.package.dowiz-core]
opt-level = 2
