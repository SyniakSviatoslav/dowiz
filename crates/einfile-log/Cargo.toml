[package]
name = "einfile-log"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/SyniakSviatoslav/dowiz"
readme = "README.md"
description = "The einfile chained event log over an einfile image: EvLog v1/v2 records, the crc quarantine policy, ChainMark. no_std + alloc; depends only on einfile-image."

[features]
default = []
# EvLog::init / append / set_tip over a path.
std = ["einfile-image/std"]
# `Doc::front`, `tail_of`, `tail_part`, `tail_into` for `einfile-sync`. Off by default: the reader
# links this crate and must not grow by a byte for doors it never opens (tools/verify/bytes.baseline).
sync = []

[dependencies]
einfile-image = { path = "../einfile-image", version = "0.1.0" }

[dev-dependencies]
# the tests write temp files through the path API
einfile-image = { path = "../einfile-image", version = "0.1.0", features = ["std"] }
# W-MG-M1: the REAL ML-DSA-65 seal (`doc/dsa_tests.rs`) through the `doc::Signer` /
# `doc::Verifier` seams, and sha256 for the test ids. DEV ONLY: `cargo tree -e no-dev` must keep
# showing einfile-image alone. Both MIT OR Apache-2.0, the same pins as einfile-sig-mldsa.
fips204 = { version = "=0.5.0", default-features = false, features = ["ml-dsa-65"] }
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = 3

# ML-DSA-65 at opt-level 0 is seconds per signature; the test seals a dozen times.
[profile.dev.package.fips204]
opt-level = 2
[profile.dev.package.sha3]
opt-level = 2
[profile.dev.package.keccak]
opt-level = 2
