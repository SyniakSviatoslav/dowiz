[package]
name = "es-bench"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "R-EMBED-STORE P7: einstore vs redb / LMDB (heed) / SQLite, and the regression gate"

# Standalone: its own workspace, so no other crate's `cargo test` builds it and its lock file
# holds the competitors' versions. Default features = einfile only (einstore + libc), which is
# what the gate (tools/gates/es-bench.sh) builds; `competitors` adds the three other engines and
# `mldsa` the signed-file rows, the two together being what `full all` needs.
[workspace]

[features]
default = []
competitors = ["dep:redb", "dep:heed", "dep:rusqlite"]
# The `signed` rows (src/signed.rs): a real ML-DSA-65 behind `doc::Signer` / `doc::Verifier`, from
# dowiz-core, which is AGPL-3.0-or-later. OFF by default and never in the gate's build: a binary
# built with this feature carries AGPL code, this crate's own source does not. One file names the
# provider (src/mldsa.rs); swapping it is that file and this line.
mldsa = ["dep:dowiz-core", "einfile-io/doc"]

[dependencies]
einstore = { path = "../einstore" }
# W-ES-P8C: the `einfile4` adapter needs KV v4, which is behind einfile-io's `tree` feature (off by
# default until P8d). A direct path dependency only to turn the feature on (cargo unifies it).
einfile-io = { path = "../einfile-io", features = ["tree"] }
libc = "0.2"
dowiz-core = { path = "../dowiz-core", optional = true }
redb = { version = "=4.4.0", optional = true }
heed = { version = "=0.22.1", optional = true }
rusqlite = { version = "=0.32.1", features = ["bundled"], optional = true }

[profile.release]
opt-level = 3
debug = false
