[package]
name = "einstore"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/SyniakSviatoslav/dowiz"
readme = "README.md"
description = "An embedded key-value store and signed event log in one file: damage refused by name, commits all-or-nothing, a file that reads with no install."
keywords = ["embedded", "database", "key-value", "event-log", "file-format"]
categories = ["database-implementations", "embedded"]

# A Rust reader/writer for the einfile format (bebop-lang
# selfhost/prelude/store.bp, docs/LANG-DB-DESIGN.md §4).
#
# This crate exists because the format is POINTER-FREE by design -- "nothing in the file is an
# address", every ref is an object-relative cell offset -- which is exactly what lets a second
# language read and write the same file. ZERO EXTERNAL dependencies: since W-ES-P1 (2026-10-29)
# the code lives in four path crates (crates/einfile-{image,kv,log,io}), each with none of its own;
# `cargo tree -e no-dev` here lists exactly those four and this one. It is the seam by which
# dowiz uses einfile as its database.
[dependencies]
einfile-image = { path = "../einfile-image", version = "0.1.0", features = ["std"] }
einfile-kv = { path = "../einfile-kv", version = "0.1.0", features = ["std"] }
einfile-log = { path = "../einfile-log", version = "0.1.0", features = ["std"] }
einfile-io = { path = "../einfile-io", version = "0.1.0" }

[profile.release]
opt-level = 3
