[package]
name = "dowiz-hub"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "One tenant's sovereign hub: the order log over a bebop store, as pure bytes-in/bytes-out logic."

[lib]
name = "dowiz_hub"
path = "src/lib.rs"

[dependencies]
# The store. Zero dependencies of its own, and it builds for wasm32.
bebop-store = { path = "../bebop-store" }
# SHA-256 only. HMAC and PBKDF2 are built on it in `crypto.rs` rather than
# pulled in, because `hmac` and `argon2` are outside native-spa-server's
# zero-dep allowlist and that gate may only shrink. See that module's header
# for what the choice costs.
sha2 = "0.10"
# THE ROOM'S DECIDERS (`src/room`, D7 phase 1): amend and pay moved here from
# the Worker so a wasm32 host runs the same code. Neither crate is new to the
# build that links this one -- the Worker already had all three -- and
# `dowiz-core` has zero dependencies of its own (its `money::Currency` is the
# one currency table `room::pay::fx` resolves against). serde_json because an
# order envelope is untrusted text and `minijson` is never pointed at that.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dowiz-core = { path = "../dowiz-core" }

[features]
# `shred` (DG10, default OFF): crypto-shredding for new logs -- `src/shred.rs`,
# a per-person key table and `seal_field`/`open_field` over AES-256-GCM.
# WHAT IT PULLS: no crate. The cipher is `dowiz_core::pq::aes_gcm` (hand-rolled,
# KAT-gated against GCM spec TC15), and `dowiz-core` is already a dependency
# above with zero dependencies of its own; it compiles `pq` unconditionally
# (it has no `pq` feature to enable), so this feature only decides whether the
# `shred` module is compiled. VERIFY the default graph stays clean:
#   cargo tree -e no-dev > a; cargo tree -e no-dev --features shred > b; diff a b   # empty
#   cargo tree -e no-dev | grep -c aes                                            # 0
# (the second is 0 because no `aes*` crate exists anywhere in the graph; the
# diff is the check that measures something.)
shred = []
