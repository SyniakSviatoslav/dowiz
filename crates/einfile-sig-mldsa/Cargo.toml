[package]
name = "einfile-sig-mldsa"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/SyniakSviatoslav/dowiz"
description = "ML-DSA-65 behind einfile-log's Signer and Verifier: external pure FIPS 204 with the empty context, the signature a sealed einfile image carries."

# DECART (W-MG-SIG, 2026-11-01; the comparison is docs/research/R-MLDSA-PROVENANCE.md §3 and §5).
# CHOSEN: fips204 0.5.0, MIT OR Apache-2.0, pure Rust, no_std with no alloc, `deny(unsafe_code)`,
# three dependencies (rand_core, sha3, zeroize), 814-attempt signing limit, zeroizes secrets
# best effort, no RUSTSEC entry, a published dudect run (on ML-DSA-44, one CPU, so a weak claim).
# AGAINST: RustCrypto ml-dsa 0.1.2, the same licence and the close second, is the FALLBACK: two
#   advisories in 2026 (a timing issue, duplicate hints accepted), six mandatory dependencies, heap
#   use; libcrux-ml-dsa, Apache-2.0 only, four 2026 advisories of which two accept an invalid
#   signature on the verify path, and its proofs stop short of `verify`; aws-lc-rs and mldsa-native,
#   the best provenance but C, so no wasm32-unknown-unknown and the Worker links this; our own
#   `dowiz_core::pq::dsa`, AGPL so a stranger cannot take it, no constant-time run, no zeroizing, no
#   attempt limit: it stays as this crate's differential oracle in tests only.
# COST: fips204 has NO independent audit and neither has the fallback; this buys more test
#   coverage and shared code with outside verifiers, not "audited". The format does not depend on
#   the choice: FORMAT §9.4 is plain FIPS 204, so any of the above verifies it, and aws-lc-rs is
#   what to recommend to a native auditor.
# ROLLBACK: dowiz-hub re-exports this crate's two types. If wasm size, time, stack or `run-all`
#   goes red, or a differential test does, swap `fips204` for `ml-dsa` here, nothing else moves.
# VERIFY: `cargo tree -e no-dev` shows einfile-log, einfile-image, einfile-crc, fips204, sha2 and their
#   own, with no getrandom and no dowiz-core.
[dependencies]
einfile-log = { path = "../einfile-log", version = "0.1.0" }
# default-rng off: this crate draws no randomness (`rnd = 0^32`) and getrandom needs a wasm shim.
fips204 = { version = "=0.5.0", default-features = false, features = ["ml-dsa-65"] }
# `actor_of`: sha256 over the key. einfile-log holds no hash; dowiz-hub already links this crate.
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
einfile-image = { path = "../einfile-image", version = "0.1.0" }
# THE ORACLE, as in einfile-log: AGPL-3.0-or-later and DEV ONLY, never linked by a user of this crate.
dowiz-core = { path = "../dowiz-core" }
serde_json = "1"

[profile.dev.package.fips204]
opt-level = 2
[profile.dev.package.dowiz-core]
opt-level = 2
[profile.dev.package.sha3]
opt-level = 2
[profile.dev.package.keccak]
opt-level = 2
