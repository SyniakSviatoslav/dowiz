[package]
name = "bebop-log-kani"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Kani proof harnesses for the small pure functions of bebop-log and bebop-image. A dev tool: bounded model checking, not a fuzzer. Nothing depends on this crate and it is in no shipped build; outside `cargo kani` it compiles to nothing."

# A crate of its own, so that:
#  - bebop-log and bebop-image stay #![forbid(unsafe_code)] with not one line changed;
#  - nothing that ships can link it (no crate names it as a dependency);
#  - the harnesses use only the public API, the one a real caller has.
#
# NO DEPENDENCY ON `kani`: `cargo kani` injects that crate itself, and the whole of this crate is
# behind `#![cfg(kani)]`, so `cargo build` here produces an empty library.
#
# Run by .github/workflows/kani.yml, which has this crate's only `cargo kani`.
[dependencies]
bebop-log = { path = "../bebop-log", version = "0.1.0" }
bebop-image = { path = "../bebop-image", version = "0.1.0" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
