[package]
name = "dowiz-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "dowiz no_std core: branchless LUT + constants + sanitize + stem + eigen + bit-exact math + geometry layer (complex/trig/modular/fft/spherical) + hypervector/rng/squash. Zero dependencies (pure core + alloc). Extracted from dowiz-kernel."

[lib]
crate-type = ["rlib"]

[dependencies]
# zero deps — pure core::, no alloc, no std.

# The extracted SIMD hot paths (householder/simd) keep the kernel's
# `cfg(feature = "std")` grammar for parity. dowiz-core never defines or enables
# a `std` feature (it is always `#![no_std]`), so that cfg is a known-but-false
# value: declare it so rustc's `unexpected_cfgs` lint stays quiet.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("std"))'] }

[dev-dependencies]
# Differential oracle for the laplacian_eqc_parity test (pins the eqc-rs
# IndexSum-emitted Laplacian against dense laplacian()). Dev-only, outside the
# zero-dep proof surface (eqc-rs is itself a zero-dep crate).
eqc-rs = { path = "../../tools/eqc-rs" }
# NIST ACVP ML-DSA-65 KAT gate (pq::dsa::dsa_acvp_tests) — test-only (de)serialization
# of the vendored KAT vectors. Never in the shipping build (`cargo tree -e no-dev` stays empty).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ACVP per-tcId test macro expansion (paste::item!) — test-only.
paste = "1.0"
