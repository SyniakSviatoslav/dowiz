[package]
name = "bebop-store"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "The bebop store library's facade: re-exports bebop-image / bebop-kv / bebop-log / bebop-io under the paths dowiz already uses, plus the DAG runtime (proj, zset, nodekey, merkle)."

# A Rust reader/writer for the bebop store file format (bebop-lang
# selfhost/prelude/store.bp, docs/LANG-DB-DESIGN.md §4).
#
# This crate exists because the format is POINTER-FREE by design -- "nothing in the file is an
# address", every ref is an object-relative cell offset -- which is exactly what lets a second
# language read and write the same file. ZERO EXTERNAL dependencies: since W-ES-P1 (2026-10-29)
# the code lives in four path crates (crates/bebop-{image,kv,log,io}), each with none of its own;
# `cargo tree -e no-dev` here lists exactly those four and this one. It is the seam by which
# dowiz uses bebop as its database.
[dependencies]
bebop-image = { path = "../bebop-image", features = ["std"] }
bebop-kv = { path = "../bebop-kv", features = ["std"] }
bebop-log = { path = "../bebop-log", features = ["std"] }
bebop-io = { path = "../bebop-io" }

[profile.release]
opt-level = 3
